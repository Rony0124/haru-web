*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }

svg { display: block; }

.num { font-variant-numeric: tabular-nums; }

/* 바탕 */

header.top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-sm); }
.date-big { font-family: var(--font-display); font-size: var(--text-2xl); line-height: 1.1; }
.date-sub { margin-top: var(--space-2xs); color: var(--color-muted); font-size: var(--text-sm); display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
.sync { color: var(--color-accent-2); font-size: var(--text-sm); text-decoration: underline; text-underline-offset: 3px; min-height: 32px; }
.head-btns { display: flex; gap: var(--space-xs); }
.icon-btn { flex: none; width: 44px; height: 44px; border-radius: var(--radius-stock); display: grid; place-items: center; color: var(--color-ink-2); background: var(--grain), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule), 0 var(--edge) 0 0 var(--color-edge); transition: translate var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap); }

.example-note button { color: var(--color-error); font-size: var(--text-sm); min-height: 32px; }

/* 점수판: 찢어진 배 노랑 종이 */
.board-wrap { filter: var(--shadow-paper); rotate: -0.8deg; margin-inline: var(--space-2xs); }
.board { position: relative; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: var(--space-xs) var(--space-sm); padding: 20px var(--space-md) var(--space-xl); border-radius: var(--radius-card) var(--radius-card) 0 0; background: var(--grain), var(--fibre), var(--color-accent); color: var(--color-accent-ink); clip-path: var(--tear-b); }
.board .cell { display: flex; flex-direction: column; gap: var(--space-2xs); min-width: 0; }
.board .cell + .cell { border-left: 1.5px solid var(--color-accent-deep); padding-left: var(--space-sm); }
.board .lbl { font-size: var(--text-sm); color: var(--color-ink-2); }
.board .pts { font-family: var(--font-display); font-size: var(--text-4xl); line-height: 1; font-variant-numeric: tabular-nums; transition: translate var(--dur-short) var(--ease-spring); }
.board .pts small { font-size: var(--text-lg); margin-left: var(--space-2xs); color: var(--color-ink-2); }
.board .pts.bump { translate: 0 -4px; }
.board .meta { font-size: var(--text-sm); color: var(--color-ink-2); }
.board .meta button { color: var(--color-ink-2); font-size: var(--text-sm); text-decoration: underline; text-underline-offset: 3px; min-height: 28px; }
.bar { grid-column: 1 / -1; margin-top: var(--space-sm); height: 10px; border-radius: var(--radius-pill); background: var(--color-track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: var(--radius-pill); background: var(--color-ink); transform-origin: left center; transform: scaleX(var(--p, 0)); transition: transform 500ms var(--ease-snap); }
.bar-lbl { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: var(--text-sm); color: var(--color-ink-2); }

/* 알림 띠 */
.alerts { display: flex; flex-direction: column; gap: var(--space-xs); }
.alert { display: flex; gap: var(--space-sm); align-items: center; padding: var(--space-sm) var(--space-md); border-radius: var(--radius-stock); background: var(--grain), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule); font-size: var(--text-sm); }

.alert.warn .tag { background: var(--color-accent-3); }
.alert.pay .tag { background: var(--color-accent); }
.alert .grow { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: var(--space-2xs) var(--space-xs); align-items: baseline; }
.alert .grow b { font-size: var(--text-md); }
.scope-tag { font-size: var(--text-xs); padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-pill); background: var(--color-paper-3); color: var(--color-ink-2); }

.day { display: flex; flex-direction: column; gap: var(--space-sm); }
.day-h, .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-xs); padding: 0 var(--space-2xs); flex-wrap: wrap; }
.day-h h2, .sec-h h2 { font-size: var(--text-xl); }

.day-h .sum, .sec-h > span { font-size: var(--text-sm); color: var(--color-muted); }

/* 카드 스톡 줄 */
.list { display: flex; flex-direction: column; gap: var(--space-xs); }
.task, .spend, .pay, .bank, .alert, .mboard, .spend-top, .setup, .list > .empty { min-width: 0; }
.task, .spend, .pay { display: flex; align-items: center; gap: var(--space-md); padding: var(--space-md) var(--space-md); border-radius: var(--radius-stock); background: var(--grain), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule), 0 var(--edge) 0 0 var(--color-edge); }
.spend { width: 100%; text-align: left; transition: translate var(--dur-micro) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap); }
.spend:active { --edge: 1px; translate: 0 2px; }
.list > .empty { padding: var(--space-md) var(--space-md); border: 1.5px dashed var(--color-edge); border-radius: var(--radius-stock); color: var(--color-muted); font-size: var(--text-sm); }

.chk { position: relative; flex: none; width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center; background: var(--color-paper); box-shadow: inset 0 0 0 2px var(--color-edge), 0 2px 0 0 var(--color-edge); transition: background-color var(--dur-short) var(--ease-snap), box-shadow var(--dur-micro) var(--ease-snap), translate var(--dur-micro) var(--ease-snap); }
.chk::after { content: ""; position: absolute; inset: -6px; }
.chk:active { translate: 0 2px; box-shadow: inset 0 0 0 2px var(--color-edge); }
.chk svg { width: 18px; height: 18px; color: var(--color-ink); opacity: 0; scale: 0.4; transition: opacity var(--dur-short) var(--ease-snap), scale var(--dur-short) var(--ease-spring); }
.task.done .chk { background: var(--color-mint); box-shadow: 0 2px 0 0 var(--color-mint-deep); }
.task.done .chk svg { opacity: 1; scale: 1; }
.task .body, .spend .body, .pay .body { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; gap: var(--space-2xs); }
.task .t, .spend .t, .pay .t { font-size: var(--text-md); overflow-wrap: anywhere; color: var(--color-ink); }

.rep { font-size: var(--text-xs); padding: var(--space-2xs) var(--space-xs); border-radius: var(--radius-pill); background: var(--color-sugar); color: var(--color-ink-2); }

.wt.hi { background: var(--color-accent-soft); color: var(--color-ink); }

.foot-links { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
.link-btn { color: var(--color-accent-2); font-size: var(--text-sm); text-decoration: underline; text-underline-offset: 3px; min-height: 36px; }

/* 가계 */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); padding: var(--space-2xs); border-radius: var(--radius-pill); background: var(--color-paper-3); }
.seg button { min-height: 44px; border-radius: var(--radius-pill); font-family: var(--font-display); font-size: var(--text-md); color: var(--color-muted); transition: background-color var(--dur-short) var(--ease-snap), color var(--dur-short) var(--ease-snap); }

.mboard, .spend-top, .bank, .setup { border-radius: var(--radius-card); background: var(--grain), var(--color-card); box-shadow: inset 0 0 0 1px var(--color-rule); }
.mboard { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-xs); padding: var(--space-md); }

.spend-big { font-family: var(--font-display); font-size: var(--text-4xl); line-height: 1.05; }

<script>
(function(){
const KEY='my-hub-v1';
/* 피보나치 점수 */
const PTS=[1,2,3,5,8,13];
const PTS_N={1:'사소',2:'가벼움',3:'보통',5:'중요',8:'아주 중요',13:'핵심'};
const FREQ={none:'반복 안 함',daily:'매일',weekly:'매주',monthly:'매달',yearly:'매년'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffD=(a,b)=>Math.round((sod(a)-sod(b))/864e5);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DOW=['일','월','화','수','목','금','토'];
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const ptsClass=p=>p>=8?'top':p>=5?'hi':'';
const stepDown=p=>{const i=PTS.indexOf(p);return i>0?PTS[i-1]:1};
/* 미루기: 원래 날짜에 계획했던 점수는 그날 만점에 남기고, 다음 날로 옮기면서 점수를 한 단계 내린다 */
function postpone(t,toDate){
  t.hist=t.hist||[];t.hist.push({date:t.date,w:t.w});
  if(t.recId){state.skips[t.recId+':'+t.date]=1;t.recTitle=recText(recOf(t)||{});t.recId=null}
  t.w=stepDown(t.w);t.pp=(t.pp||0)+1;t.date=toDate;
}
/* 늦게 체크: 실제로 한 날(ds)로 완료 처리. 그날 이후 미룬 기록은 지우고 그날 점수로 되돌린다 */
function completeOn(t,ds){
  const hist=t.hist||[], i=hist.findIndex(h=>h.date===ds);
  if(i>=0){t.w=hist[i].w;t.hist=hist.slice(0,i);t.pp=t.hist.length;t.date=ds}
  t.done=true;t.doneAt=ds;t.pts=t.w;
}
function doneOptions(t){
  const T=ymd(today), lim=ymd(addD(today,-14));
  const o=(t.hist||[]).map(h=>({date:h.date,w:h.w}));
  if(t.date<=T)o.push({date:t.date,w:t.w});
  return o.filter(x=>x.date>=lim);
}
/* 앱을 열지 않은 사이 지난 할일은 자동으로 미룬 것으로 처리 (매일 반복은 제외) */
function autoRoll(){
  const T=ymd(today);let n=0;
  state.tasks.forEach(t=>{
    if(t.done||t.date>=T)return;
    if(t.recId&&recOf(t)?.freq==='daily')return;
    while(t.date<T){const nx=ymd(addD(parse(t.date),1));postpone(t,nx);n++}
  });
  return n;
}
/* 날짜별 달성: 그날 계획했던 점수(미룬 것 포함) 대비 그날 계획대로 끝낸 점수 */
function dayStat(ds){
  let plan=0,got=0;
  state.tasks.forEach(t=>{
    (t.hist||[]).forEach(h=>{if(h.date===ds)plan+=h.w});
    if(t.date===ds){plan+=t.w;if(t.done)got+=t.pts||t.w}
  });
  return {plan,got,pct:plan?Math.round(got/plan*100):0};
}

let today=sod(new Date());
let state, tab='todo';

/* ---------- 데이터 ---------- */
function seed(){
  const T=ymd(today),T1=ymd(addD(today,1)),T2=ymd(addD(today,2));
  const ym=T.slice(0,7);
  const a1=uid(),a2=uid(),a3=uid();
  const f=[
    {id:uid(),name:'월세',amount:550000,day:25,acc:a1,ex:1},
    {id:uid(),name:'휴대폰 요금',amount:69000,day:today.getDate(),acc:a2,scope:'개인',ex:1},
    {id:uid(),name:'실손보험',amount:89000,day:Math.min(today.getDate()+1,28),acc:a2,ex:1},
    {id:uid(),name:'적금',amount:300000,day:12,acc:a1,ex:1},
    {id:uid(),name:'OTT 구독',amount:17000,day:3,acc:a3,scope:'개인',ex:1}
  ];
  const paid={};
  f.forEach(x=>{if(x.day<today.getDate())paid[ym+':'+x.id]=1});
  return {v:2,updatedAt:0,goal:50,
    tasks:[
      {id:uid(),title:'아침 메일 정리',date:T,w:1,memo:'',done:true,doneAt:T,pts:1,ex:1},
      {id:uid(),title:'주간 보고서 초안 쓰기',date:T,w:5,memo:'금요일 회의 전까지',done:false,ex:1},
      {id:uid(),title:'택배 반품 접수',date:T,w:2,memo:'',done:false,ex:1},
      {id:uid(),title:'치과 예약 전화',date:T1,w:3,memo:'',done:false,ex:1},
      {id:uid(),title:'이직 포트폴리오 마감',date:T2,w:13,memo:'',done:false,ex:1}
    ],
    recs:[
      {id:'r_ex1',title:'스트레칭 10분',w:1,memo:'',freq:'daily',start:T,ex:1},
      {id:'r_ex2',title:'분리수거',w:2,memo:'',freq:'weekly',dows:[today.getDay()===0?6:(today.getDay()+1)%7],start:T,ex:1}
    ],
    skips:{},
    accounts:[{id:a1,name:'국민은행',bal:1200000,ex:1},{id:a2,name:'신한은행',bal:null,ex:1},{id:a3,name:'카카오뱅크',bal:300000,ex:1}],
    pays:[{id:uid(),name:'내 월급',day:10,acc:a1,amount:3200000,shift:true,ex:1},{id:uid(),name:'와이프 월급',day:25,acc:a2,amount:2800000,shift:true,ex:1}],
    spend:[
      {id:uid(),date:T,amount:9500,cat:'식비',memo:'점심 김치찌개',who:'나',pay:a1,at:3,ex:1},
      {id:uid(),date:T,amount:4800,cat:'카페',memo:'아이스 라떼',who:'와이프',pay:'',at:2,ex:1},
      {id:uid(),date:ymd(addD(today,-1)),amount:62000,cat:'생활',memo:'장보기',who:'나',pay:a2,at:1,ex:1},
      {id:uid(),date:ymd(addD(today,-1)),amount:1450,cat:'교통',memo:'버스',who:'나',pay:'',at:0,ex:1}
    ],
    fixed:f, paid, hasEx:true};
}
function migrate(s){
  if(!s||typeof s!=='object')return null;
  if(s.v===1){
    const map={1:1,2:3,3:5,4:8};
    (s.tasks||[]).forEach(t=>{t.w=map[t.w]||3;if(t.done)t.pts=t.w});
    s.v=2;
  }
  if(s.v!==2)return null;
  s.tasks=s.tasks||[];s.recs=s.recs||[];s.skips=s.skips||{};s.accounts=s.accounts||[];
  s.fixed=s.fixed||[];s.fixed.forEach(f=>{if(!f.scope)f.scope='공동'});s.spend=s.spend||[];s.paid=s.paid||{};s.pays=s.pays||[];s.goal=s.goal||50;s.updatedAt=s.updatedAt||0;
  // 1년 넘은 완료 할일은 정리
  const cut=ymd(addD(today,-400));
  s.tasks=s.tasks.filter(t=>!(t.done&&t.date<cut));
  return s;
}
/* 저장: 휴대폰 내부 저장소(Preferences)를 기본으로, 브라우저에서 열면 localStorage */
const N=window.HaruNative||null;
async function load(){
  let raw=null;
  if(N){try{raw=(await N.Preferences.get({key:KEY})).value}catch(e){}}
  if(!raw){try{raw=localStorage.getItem(KEY)}catch(e){}}
  try{const s=migrate(JSON.parse(raw));if(s)return s}catch(e){}
  return seed();
}
function saveLocal(){
  const json=JSON.stringify(state);
  if(N){N.Preferences.set({key:KEY,value:json}).catch(()=>{})}
  try{localStorage.setItem(KEY,json)}catch(e){}
}

state={v:2,tasks:[],recs:[],skips:{},accounts:[],fixed:[],paid:{},pays:[],goal:50,updatedAt:0};

/* ---------- 반복 할일 ---------- */
function recMatches(r,d){
  if(ymd(d)<r.start)return false;
  const day=d.getDate(),m=d.getMonth(),last=dim(d.getFullYear(),m);
  if(r.freq==='daily')return true;
  if(r.freq==='weekly')return (r.dows||[]).includes(d.getDay());
  if(r.freq==='monthly')return day===Math.min(r.dom,last);
  if(r.freq==='yearly')return m===r.mon-1&&day===Math.min(r.dom,last);
  return false;
}
function recText(r){
  if(r.freq==='daily')return '매일';
  if(r.freq==='weekly')return '매주 '+(r.dows||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DOW[d]).join('·');
  if(r.freq==='monthly')return `매달 ${r.dom}일`;
  if(r.freq==='yearly')return `매년 ${r.mon}월 ${r.dom}일`;
  return '';
}
function materialize(){
  let changed=false;
  for(let i=0;i<3;i++){
    const d=addD(today,i),ds=ymd(d);
    state.recs.forEach(r=>{
      if(!recMatches(r,d)||state.skips[r.id+':'+ds])return;
      if(state.tasks.some(t=>t.recId===r.id&&t.date===ds))return;
      state.tasks.push({id:uid(),title:r.title,w:r.w,memo:r.memo,date:ds,done:false,recId:r.id,ex:r.ex});
      changed=true;
    });
  }
  if(autoRoll())changed=true;
  if(changed){state.updatedAt=Math.max(state.updatedAt,1);saveLocal()}
}
function recOf(t){return t.recId?state.recs.find(r=>r.id===t.recId):null}

/* ---------- 계산 ---------- */
function scores(){
  const ws=addD(today,-((today.getDay()+6)%7)), we=addD(ws,6);
  const mk=ymd(today).slice(0,7);
  let wk=0,mo=0,wkN=0,moN=0;
  state.tasks.forEach(t=>{if(!t.done||!t.doneAt)return;const d=parse(t.doneAt);
    if(d>=ws&&d<=we){wk+=t.pts;wkN++} if(t.doneAt.slice(0,7)===mk){mo+=t.pts;moN++}});
  return {wk,mo,wkN,moN,ws,we};
}
function dueIn(f,y,m){return new Date(y,m,Math.min(f.day,dim(y,m)))}
function occ(f){ // 아직 확인 안 한 가장 이른 출금 회차
  const y=today.getFullYear(),m=today.getMonth();
  for(let k=0;k<3;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());const key=ymd(d).slice(0,7)+':'+f.id;
    if(!state.paid[key])return {date:d,key,d:diffD(d,today)}}
  const dt=new Date(y,m+3,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
  return {date:d,key:ymd(d).slice(0,7)+':'+f.id,d:diffD(d,today)};
}
// [from, to) 사이에 빠질 출금 (확인 안 한 것만). withOverdue면 이번 달에 이미 지났는데 확인 안 한 것도 포함
function dueBetween(from,to,withOverdue,fixedList){
  const out=[];const y=today.getFullYear(),m=today.getMonth();
  (fixedList||state.fixed).forEach(f=>{
    for(let k=0;k<4;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
      const key=ymd(d).slice(0,7)+':'+f.id; if(state.paid[key])continue;
      if((d>=from&&d<to)||(withOverdue&&k===0&&d<today))out.push({f,date:d,key});}
  });
  return out.sort((a,b)=>a.date-b.date);
}
function payDate(p,y,m){
  const dt=new Date(y,m,1);let d=new Date(dt.getFullYear(),dt.getMonth(),Math.min(p.day,dim(dt.getFullYear(),dt.getMonth())));
  if(p.shift){while(d.getDay()===0||d.getDay()===6)d=addD(d,-1)}
  return d;
}
function payEvents(){
  const ev=[];const y=today.getFullYear(),m=today.getMonth();
  for(let k=-1;k<=3;k++)state.pays.forEach(p=>ev.push({p,date:payDate(p,y,m+k)}));
  return ev.sort((a,b)=>a.date-b.date);
}
function accName(id){const a=state.accounts.find(a=>a.id===id);return a?a.name:'은행 미지정'}
function byBank(list){const g={};list.forEach(x=>{const k=x.f.acc;g[k]=(g[k]||0)+x.f.amount});return g}

      sheet.querySelector('#sf').addEventListener('submit',e=>{e.preventDefault();

        if(isNew){state.spend.push({id:uid(),at:Date.now(),...data});state.lastCat=data.cat;state.lastWho=data.who;state.lastPay=data.pay}
        else Object.assign(x,data);
        if(data.date.slice(0,7)!==ymd(today).slice(0,7))bookMonth=data.date.slice(0,7);

/* ---------- 시트 ---------- */
const root=document.getElementById('sheetRoot');
function openSheet(html,onMount,opts){
  const old=opts&&opts.keep?root.querySelector('.sheet'):null;
  let sheet;
  if(old){ // 이미 열린 시트는 내용만 바꾼다 (열리는 연출 없이, 스크롤 위치 유지)
    const top=old.scrollTop; old.innerHTML=html; old.scrollTop=top; sheet=old;
  }else{
    root.innerHTML=`<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    root.querySelector('.scrim').addEventListener('click',e=>{if(e.target.dataset.close)closeSheet()});
    sheet=root.querySelector('.sheet');
  }
  sheet.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeSheet);
  onMount&&onMount(sheet);
  if(old)return;
  const f=sheet.querySelector('input:not([type=checkbox]),textarea');f&&setTimeout(()=>f.focus(),60);
}
function closeSheet(){root.innerHTML=''}
function chipsSel(sheet,name){const b=sheet.querySelector(`[data-group="${name}"] [aria-pressed="true"]`);return b?b.dataset.v:null}
function chipsMulti(sheet,name){return [...sheet.querySelectorAll(`[data-group="${name}"] [aria-pressed="true"]`)].map(b=>b.dataset.v)}
function bindChips(sheet,onChange){
  sheet.querySelectorAll('[data-group]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
    if(g.dataset.multi){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')}
    else g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    onChange&&onChange(g.dataset.group)}));
}
function confirmBtn(btn,fn){btn.onclick=()=>{if(btn.dataset.sure)fn();else{btn.dataset.sure=1;btn.textContent='한 번 더 누르면 삭제'}}}
const ptsChips=cur=>`<div class="chips pts" data-group="w">${PTS.map(p=>`<button type="button" data-v="${p}" aria-pressed="${p===cur}"><b>${p}</b><span>${PTS_N[p]}</span></button>`).join('')}</div>`;
const dayOpts=(sel)=>Array.from({length:31},(_,i)=>`<option value="${i+1}"${sel===i+1?' selected':''}>${i+1}일</option>`).join('');

/* 할일 시트. mode: new | task | rule */
/* 할일 시트. mode: new | task | rule. preset: 새 할일의 기본 날짜 */
function taskSheet(mode,obj,preset){
  const T=ymd(today);
  const t=mode==='task'?obj:null, rule=mode==='rule'?obj:(t?recOf(t):null);
  const src=mode==='rule'?rule:t;
  const curW=src?src.w:3;
  const curDate=mode==='rule'?(rule.start>T?rule.start:T):t?t.date:(preset||T);
  const cd=parse(curDate);
  const quick=[[T,'오늘'],[ymd(addD(today,1)),'내일'],[ymd(addD(today,2)),'모레']];
  const showRepeat=mode!=='task';
  const r0=mode==='rule'?rule:{freq:'none',dows:[cd.getDay()],dom:cd.getDate(),mon:cd.getMonth()+1};
  const title=mode==='new'?'할일 추가':mode==='rule'?'반복 할일 고치기':'할일 고치기';
  openSheet(`<h3>${title}</h3>
    <form id="tf" class="form">
      <div class="field"><label for="t-title">할일</label><input id="t-title" maxlength="80" value="${esc(src?.title)}" placeholder="예: 은행 서류 제출"></div>
      <div class="field"><span class="lab">점수 (중요할수록 크게)</span>${ptsChips(curW)}</div>
      <div class="field"><span class="lab" id="t-date-lab">${mode==='rule'?'시작일':'날짜'}</span>
        <div class="chips" data-group="date">${quick.map(([v,n])=>`<button type="button" data-v="${v}" aria-pressed="${v===curDate}">${n}</button>`).join('')}
        <input id="t-date" type="date" value="${curDate}" min="${mode==='task'?'':T}" class="date-in" aria-label="날짜 고르기"></div></div>
      ${showRepeat?`<div class="field"><span class="lab">반복</span><div class="chips" data-group="freq">${Object.keys(FREQ).filter(k=>mode==='new'||k!=='none').map(k=>`<button type="button" data-v="${k}" aria-pressed="${k===r0.freq}">${FREQ[k]}</button>`).join('')}</div></div>
        <div class="field" id="g-dow"><span class="lab">요일 (여러 개 가능)</span><div class="chips" data-group="dow" data-multi="1">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-v="${d}" aria-pressed="${(r0.dows||[]).includes(d)}">${DOW[d]}</button>`).join('')}</div></div>
        <div class="row2" id="g-dom"><div class="field" id="g-mon"><label for="t-mon">월</label><select id="t-mon">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${r0.mon===i+1?' selected':''}>${i+1}월</option>`).join('')}</select></div>
          <div class="field"><label for="t-dom">날짜</label><select id="t-dom">${dayOpts(r0.dom||cd.getDate())}</select></div></div>
        <p class="hint rep-sum" id="t-repsum"></p>`
      :''}
      ${mode==='task'&&rule?`<div class="repbox"><span>${esc(recText(rule))} 반복 중</span><button type="button" class="link-btn" id="t-rule">반복 규칙 고치기</button></div>`:''}
      ${mode==='task'?(t.done?`<div class="repbox"><span>${(t.doneAt||t.date)===T?'오늘':md(parse(t.doneAt||t.date))} 완료, ${t.pts}점 받음</span><button type="button" class="link-btn" id="t-undo">완료 취소</button></div>`
        :(()=>{const o=doneOptions(t);return o.length?`<div class="field"><span class="lab">깜빡하고 체크 못 했다면</span><div class="chips pts">${o.map(x=>`<button type="button" data-done="${x.date}"><b>${x.date===T?'오늘':md(parse(x.date))}</b><span>했어요 +${x.w}</span></button>`).join('')}</div><p class="hint">실제로 한 날을 누르면 그날 완료로 기록되고, 미루면서 깎인 점수도 되돌아와요.</p></div>`:''})()):''}
      ${mode==='task'&&!t.done&&t.date<=T?`<button type="button" class="btn postpone" id="t-pp">내일로 미루기 (${t.w}점이 ${stepDown(t.w)}점으로)</button><p class="hint">미루면 오늘 달성률에서 빠지고, 내일 받을 점수가 한 단계 줄어요.</p>`:''}
      <div class="field"><label for="t-memo">메모 (선택)</label><input id="t-memo" maxlength="120" value="${esc(src?.memo)}"></div>
      ${mode==='task'&&rule?'<p class="hint">이름·점수·메모를 바꾸면 앞으로 생길 반복 할일에도 적용돼요.</p>':''}
      <p class="err" id="t-err" hidden></p>
      <div class="actions">${mode==='new'?'':'<button type="button" class="btn danger" id="t-del">삭제</button>'}<button type="button" class="btn" data-x>취소</button><button class="btn primary">${mode==='new'?'추가':'저장'}</button></div>
    </form>`,sheet=>{
      const q=id=>sheet.querySelector(id);
      const di=q('#t-date');
      let auto=mode==='new'; // 반복 조건을 직접 건드리기 전까지는 날짜를 따라간다
      const markDate=()=>sheet.querySelectorAll('[data-group="date"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===di.value));
      const follow=()=>{if(!showRepeat||!auto||!di.value)return;const d=parse(di.value);
        sheet.querySelectorAll('[data-group="dow"] button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===d.getDay()));
        q('#t-dom').value=d.getDate();q('#t-mon').value=d.getMonth()+1;};
      const summary=()=>{if(!showRepeat)return;const f=chipsSel(sheet,'freq'),el=q('#t-repsum');
        if(f==='none'||!di.value){el.textContent='';return}
        const r={freq:f,dows:chipsMulti(sheet,'dow').map(Number),dom:+q('#t-dom').value,mon:+q('#t-mon').value};
        const d=parse(di.value);el.textContent=`${d.getMonth()+1}월 ${d.getDate()}일부터 ${recText(r)}`;};
      const sync=g=>{
        if(g==='date'){di.value=chipsSel(sheet,'date');follow()}
        if(g==='dow')auto=false;
        if(showRepeat){const f=chipsSel(sheet,'freq');
          q('#g-dow').hidden=f!=='weekly';
          q('#g-dom').hidden=!(f==='monthly'||f==='yearly');
          q('#g-mon').hidden=f!=='yearly';
          q('#t-date-lab').textContent=(mode==='rule'||f!=='none')?'시작일':'날짜';}
        summary();};
      bindChips(sheet,sync);sync();
      di.addEventListener('change',()=>{markDate();follow();summary()});
      if(showRepeat)['#t-dom','#t-mon'].forEach(id=>q(id).addEventListener('change',()=>{auto=false;summary()}));
      const rb=q('#t-rule');if(rb)rb.onclick=()=>taskSheet('rule',rule);
      sheet.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
        const ds=b.dataset.done, r=b.getBoundingClientRect();
        completeOn(t,ds);save();closeSheet();render();burst(r.left+r.width/2,r.top+r.height/2,t.w);
        toast(`${ds===T?'오늘':md(parse(ds))} 완료로 기록했어요. ${t.pts}점을 받았어요`)});
      const ub=q('#t-undo');
      if(ub)ub.onclick=()=>{t.done=false;t.doneAt=null;t.pts=0;save();closeSheet();render();toast('완료를 취소했어요')};
      const pb=q('#t-pp');
      if(pb)pb.onclick=()=>{const from=t.w;postpone(t,ymd(addD(parse(t.date),1)));save();closeSheet();render();toast(`내일로 미뤘어요. ${from}점이 ${t.w}점이 됐어요`)};
      const del=q('#t-del');
      if(del)confirmBtn(del,()=>{
        if(mode==='rule'){state.recs=state.recs.filter(r=>r.id!==rule.id);state.tasks=state.tasks.filter(x=>!(x.recId===rule.id&&!x.done&&x.date>=T))}
        else{if(t.recId)state.skips[t.recId+':'+t.date]=1;state.tasks=state.tasks.filter(x=>x.id!==t.id)}
        save();closeSheet();render();toast(mode==='rule'?'반복 할일을 없앴어요':'삭제했어요')});
      q('#tf').addEventListener('submit',e=>{e.preventDefault();
        const err=q('#t-err');const bad=m=>{err.textContent=m;err.hidden=false};
        const ttl=q('#t-title').value.trim();
        if(!ttl)return bad('할일 내용을 적어 주세요.');
        const date=di.value;if(!date)return bad('날짜를 골라 주세요.');
        const w=+chipsSel(sheet,'w'), memo=q('#t-memo').value.trim();
        const freq=showRepeat?chipsSel(sheet,'freq'):'none';
        let sched=null;
        if(freq!=='none'){
          sched={freq};
          if(freq==='weekly'){sched.dows=chipsMulti(sheet,'dow').map(Number);if(!sched.dows.length)return bad('반복할 요일을 하나 이상 골라 주세요.')}
          if(freq==='monthly'||freq==='yearly')sched.dom=+q('#t-dom').value;
          if(freq==='yearly')sched.mon=+q('#t-mon').value;
        }
        const dl=parse(date), when=date===T?'오늘':`${dl.getMonth()+1}월 ${dl.getDate()}일`;
        if(mode==='new'){
          if(sched)state.recs.push({id:uid(),title:ttl,w,memo,start:date,...sched});
          else state.tasks.push({id:uid(),title:ttl,w,memo,date,done:false});
          save();closeSheet();render();toast(sched?`${when}부터 ${recText(sched)} 반복해요`:`${when} 할일로 추가했어요`);return;
        }
        if(mode==='rule'){
          const changed=JSON.stringify([rule.freq,rule.dows,rule.dom,rule.mon,rule.start])!==JSON.stringify([sched.freq,sched.dows,sched.dom,sched.mon,date]);
          delete rule.dows;delete rule.dom;delete rule.mon;
          Object.assign(rule,{title:ttl,w,memo,start:date},sched);
          if(changed)state.tasks=state.tasks.filter(x=>!(x.recId===rule.id&&!x.done&&x.date>=T));
          else state.tasks.forEach(x=>{if(x.recId===rule.id&&!x.done&&x.date>=T)Object.assign(x,{title:ttl,w,memo})});
          save();closeSheet();render();toast('반복 할일을 고쳤어요');return;
        }
        if(t.recId&&date!==t.date){state.skips[t.recId+':'+t.date]=1;t.recId=null}
        Object.assign(t,{title:ttl,w,memo,date}); if(t.done)t.pts=w;
        if(rule&&t.recId){Object.assign(rule,{title:ttl,w,memo});state.tasks.forEach(x=>{if(x.recId===rule.id&&!x.done&&x.date>=T)Object.assign(x,{title:ttl,w,memo})})}
        save();closeSheet();render();toast('저장했어요');
      });
    });
}
/* ---------- 달력 ---------- */
let calMonth=null, calSel=null;
function dayItems(ds){
  const d=parse(ds), T=ymd(today);
  const tasks=state.tasks.filter(t=>t.date===ds);
  const moved=state.tasks.filter(t=>t.date!==ds&&(t.hist||[]).some(h=>h.date===ds));
  const virt=ds>=T?state.recs.filter(r=>recMatches(r,d)&&!state.skips[r.id+':'+ds]&&!tasks.some(t=>t.recId===r.id)):[];
  const fixed=state.fixed.filter(f=>ymd(dueIn(f,d.getFullYear(),d.getMonth()))===ds).map(f=>({f,paid:!!state.paid[ds.slice(0,7)+':'+f.id]}));
  const pays=state.pays.filter(p=>ymd(payDate(p,d.getFullYear(),d.getMonth()))===ds);
  return {tasks,virt,fixed,pays,moved};
}
function calendarSheet(keep){
  const T=ymd(today);
  calMonth=calMonth||T.slice(0,7); calSel=calSel||T;
  const [Y,M]=calMonth.split('-').map(Number);
  const first=new Date(Y,M-1,1), lead=(first.getDay()+6)%7, n=dim(Y,M-1);
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span class="cal-cell empty"></span>';
  for(let k=1;k<=n;k++){
    const ds=`${Y}-${pad(M)}-${pad(k)}`, it=dayItems(ds);
    const nt=it.tasks.length+it.virt.length+it.moved.length, done=it.tasks.filter(t=>t.done).length;
    const dots=(nt?`<i class="d-task${done===nt?' all':''}"></i>`:'')+(it.fixed.length?'<i class="d-fixed"></i>':'')+(it.pays.length?'<i class="d-pay"></i>':'');
    const dw=new Date(Y,M-1,k).getDay();
    cells+=`<button class="cal-cell${ds===T?' today':''}${ds===calSel?' sel':''}${dw===0?' sun':dw===6?' sat':''}" data-ds="${ds}"><b class="num">${k}</b><span class="dots">${dots}</span></button>`;
  }
  const sel=dayItems(calSel), sd=parse(calSel);
  const row=(cls,main,side,attr='')=>`<div class="cal-row ${cls}" ${attr}><span class="main">${main}</span><span class="side num">${side}</span></div>`;
  const list=[
    ...sel.pays.map(p=>row('pay',`월급 <small>${esc(p.name)}</small>`,p.amount?won(p.amount):'')),
    ...sel.fixed.map(({f,paid})=>row('fixed',`${esc(f.name)} <small>${f.scope||'공동'} 출금</small><small>${esc(accName(f.acc))}</small>`,(paid?'완료 ':'')+won(f.amount))),
    ...sel.tasks.sort((a,b)=>a.done-b.done||b.w-a.w).map(t=>`<button class="cal-row task${t.done?' done':''}" data-tid="${t.id}"><span class="main">${esc(t.title)}${t.pp?` <small class="pp">미룸 ${t.pp}회</small>`:''}</span><span class="side num">+${t.w}</span></button>`),
    ...sel.moved.map(t=>`<button class="cal-row task moved" data-tid="${t.id}"><span class="main">${esc(t.title)} <small class="pp">${t.done?'완료 '+md(parse(t.doneAt)):md(parse(t.date))+'로 미룸'}</small></span><span class="side num">+${(t.hist.find(h=>h.date===calSel)||{}).w}</span></button>`),
    ...sel.virt.map(r=>`<button class="cal-row task virt" data-rid="${r.id}"><span class="main">${esc(r.title)} <small>${esc(recText(r))}</small></span><span class="side num">+${r.w}</span></button>`)
  ].join('');
  openSheet(`<div class="cal-head"><button class="icon-btn" data-cal="-1" aria-label="이전 달">‹</button><h3 class="num">${Y}년 ${M}월</h3><button class="icon-btn" data-cal="1" aria-label="다음 달">›</button></div>
    <div class="cal-grid">${['월','화','수','목','금','토','일'].map((d,i)=>`<span class="cal-dow${i===5?' sat':i===6?' sun':''}">${d}</span>`).join('')}${cells}</div>
    <div class="cal-legend"><span><i class="d-task"></i>할일</span><span><i class="d-fixed"></i>출금</span><span><i class="d-pay"></i>월급</span></div>
    <div class="cal-day"><div class="sec-h"><h2>${sd.getMonth()+1}월 ${sd.getDate()}일 ${DOW[sd.getDay()]}요일</h2><span>${calSel===T?'오늘':''}</span></div>
      <div class="cal-list">${list||'<p class="hint">일정이 없어요.</p>'}</div></div>
    <div class="actions"><button class="btn" data-x>닫기</button><button class="btn primary" id="cal-add">이 날 할일 추가</button></div>`,sheet=>{
      sheet.classList.add('cal-sheet');
      sheet.querySelectorAll('[data-cal]').forEach(b=>b.onclick=()=>{const d=new Date(Y,M-1+(+b.dataset.cal),1);calMonth=ymd(d).slice(0,7);calendarSheet(true)});
      sheet.querySelectorAll('[data-ds]').forEach(b=>b.onclick=()=>{calSel=b.dataset.ds;calendarSheet(true)});
      sheet.querySelectorAll('[data-tid]').forEach(b=>b.onclick=()=>taskSheet('task',state.tasks.find(t=>t.id===b.dataset.tid)));
      sheet.querySelectorAll('[data-rid]').forEach(b=>b.onclick=()=>taskSheet('rule',state.recs.find(r=>r.id===b.dataset.rid)));
      sheet.querySelector('#cal-add').onclick=()=>taskSheet('new',null,calSel<T?T:calSel);
    },{keep});

// 2026년 기준 월급 실수령 추정 (간이세액표 산식 근사)
const RATE={np:0.0475,npMin:410000,npMax:6590000,hi:0.03595,ltc:0.1314,ei:0.009};
const t10=x=>Math.floor(x/10)*10;
function earnDed(A){if(A<=5e6)return A*.7;if(A<=15e6)return 3.5e6+(A-5e6)*.4;if(A<=45e6)return 7.5e6+(A-15e6)*.15;if(A<=1e8)return 12e6+(A-45e6)*.05;return Math.min(2e7,14.75e6+(A-1e8)*.02)}
function specialDed(A,fam){
  if(A>1.2e8)return 0;
  const over4=Math.max(0,A-4e7)*.04;
  if(fam<=1){if(A<=3e7)return 3.1e6+A*.04;if(A<=4.5e7)return 3.1e6+A*.04-(A-3e7)*.05;if(A<=7e7)return 3.1e6+A*.015;return 3.1e6+A*.005}
  if(fam===2){if(A<=3e7)return 3.6e6+A*.04;if(A<=4.5e7)return 3.6e6+A*.04-(A-3e7)*.05;if(A<=7e7)return 3.6e6+A*.02;return 3.6e6+A*.01}
  if(A<=3e7)return 5e6+A*.07;if(A<=4.5e7)return 5e6+A*.07-(A-3e7)*.05+over4;if(A<=7e7)return 5e6+A*.05+over4;return 5e6+A*.03+over4;
}
function progTax(x){const B=[[14e6,.06,0],[5e7,.15,1.26e6],[8.8e7,.24,5.76e6],[1.5e8,.35,15.44e6],[3e8,.38,19.94e6],[5e8,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];for(const[c,r,d]of B)if(x<=c)return Math.max(0,x*r-d);return 0}
function earnCredit(tax,A){let c=tax<=1.3e6?tax*.55:715000+(tax-1.3e6)*.3;let lim;if(A<=3.3e7)lim=740000;else if(A<=7e7)lim=Math.max(660000,740000-(A-3.3e7)*.008);else if(A<=1.2e8)lim=Math.max(500000,660000-(A-7e7)*.5);else lim=Math.max(200000,500000-(A-1.2e8)*.5);return Math.min(c,lim)}
function childCredit(n){if(n<=0)return 0;if(n===1)return 12500;if(n===2)return 29160;return 29160+(n-2)*25000}
function estimatePay({annual,nontax=200000,fam=1,kids=0}){
  const G=annual/12, T=Math.max(0,G-nontax), A=T*12;
  const np=t10(Math.min(Math.max(T,RATE.npMin),RATE.npMax)*RATE.np);
  const hi=t10(T*RATE.hi), ltc=t10(hi*RATE.ltc), ei=t10(T*RATE.ei);
  const income=A-earnDed(A);
  const base=Math.max(0,income-1.5e6*fam-np*12-specialDed(A,fam));
  const calc=progTax(base);
  let it=t10(Math.max(0,(calc-earnCredit(calc,A))/12-childCredit(kids)));
  if(T<=1.06e6)it=0;
  const lt=t10(it*.1);
  const ded=np+hi+ltc+ei+it+lt;
  return {gross:Math.round(G),np,hi,ltc,ei,it,lt,ded,net:Math.round(G-ded)};
}

const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
resize();addEventListener('resize',resize);
function burst(x,y,size){
  if(reduce)return;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--color-accent','--color-mint','--color-accent-3','--color-accent-2'].map(v=>cs.getPropertyValue(v).trim());
  const n=Math.min(90,18+size*5);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*(3+size*.35);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,c:cols[i%cols.length],r:2+Math.random()*3,rot:Math.random()*6,sq:Math.random()<.5})}
  if(!raf)tick();
}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.life-=.018;p.rot+=.2;
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);
    if(p.sq)cx.fillRect(-p.r*d,-p.r*d/2,p.r*2*d,p.r*d);else{cx.beginPath();cx.arc(0,0,p.r*d,0,7);cx.fill()}cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;
}
function countUp(el,from,to){
  if(!el)return;if(reduce){el.firstChild.nodeValue=to;return}
  const t0=performance.now(),dur=600;
  (function step(t){const k=Math.min(1,(t-t0)/dur);el.firstChild.nodeValue=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
  el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),260);
}
function flyPoints(fromEl,pts,onEnd){
  const target=document.getElementById('wkPts');
  if(reduce||!target){onEnd();return}
  const a=fromEl.getBoundingClientRect(),b=target.getBoundingClientRect();
  const s=document.createElement('span');s.className='fly';s.textContent='+'+pts;
  s.style.left=a.left+'px';s.style.top=a.top+'px';document.body.appendChild(s);
  const dx=b.left+20-a.left,dy=b.top+10-a.top;
  const an=s.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:'translate(0,-28px) scale(1.25)',opacity:1,offset:.25},{transform:`translate(${dx}px,${dy}px) scale(.8)`,opacity:.9}],{duration:750,easing:'cubic-bezier(.5,0,.3,1)'});
  an.onfinish=()=>{s.remove();onEnd()};
}

let notifT;
function scheduleNotifs(){clearTimeout(notifT);notifT=setTimeout(reschedule,800)}
function at(d,h,m){const x=new Date(d);x.setHours(h,m,0,0);return x}
function tasksOn(ds,i){
  const d=parse(ds);
  const list=state.tasks.filter(t=>t.date===ds&&!t.done);
  state.recs.forEach(r=>{
    if(!recMatches(r,d)||state.skips[r.id+':'+ds])return;
    if(state.tasks.some(t=>t.recId===r.id&&t.date===ds))return;
    list.push({title:r.title,w:r.w});
  });
  const late=state.tasks.filter(t=>t.date===ds&&!t.done&&t.pp).length;
  return {list:list.sort((a,b)=>b.w-a.w),late};
}
function buildNotifs(){
  const now=new Date(), out=[];
  // 아침 할일 요약 (07:30)
  for(let i=0;i<7;i++){
    const d=addD(today,i), when=at(d,7,30); if(when<=now)continue;
    const {list,late}=tasksOn(ymd(d),i);
    if(!list.length&&!late)continue;
    const pts=list.reduce((s,t)=>s+t.w,0);
    out.push({id:1000+i,title:`오늘 할일 ${list.length}개 · +${pts}점`,
      body:list.slice(0,3).map(t=>'· '+t.title).join('\n')+(list.length>3?`\n외 ${list.length-3}개`:'')+(late?`\n그중 미룬 할일 ${late}개`:''),when});
  }
  // 고정지출: 전날 20:00, 당일 08:00
  let fid=2000;const y=today.getFullYear(),m=today.getMonth();
  state.fixed.forEach(f=>{
    for(let k=0;k<3;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
      if(state.paid[ymd(d).slice(0,7)+':'+f.id])continue;
      const line=`[${f.scope||'공동'}] ${f.name} ${won(f.amount)} · ${accName(f.acc)}`;
      const eve=at(addD(d,-1),20,0), morn=at(d,8,0);
      if(eve>now)out.push({id:fid++,title:'내일 출금 예정',body:line+'\n잔액을 확인해 두세요',when:eve});
      if(morn>now)out.push({id:fid++,title:'오늘 출금일',body:line,when:morn});
    }
  });
  // 월급날 08:05
  let pid=4000;
  payEvents().forEach(e=>{const when=at(e.date,8,5);if(when<=now||diffD(e.date,today)>70)return;
    out.push({id:pid++,title:`오늘 ${e.p.name} 월급날`,body:(e.p.amount?won(e.p.amount):'')+(e.p.acc?' → '+accName(e.p.acc):''),when});});
  return out.sort((a,b)=>a.when-b.when).slice(0,60);
}
async function reschedule(){
  if(!N)return;
  const LN=N.LocalNotifications;
  try{
    const perm=await LN.checkPermissions();
    if(perm.display!=='granted'){notifState='off';return}
    notifState='on';
    const pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=buildNotifs();
    if(list.length)await LN.schedule({notifications:list.map(n=>({id:n.id,title:n.title,body:n.body,largeBody:n.body,channelId:'haru',smallIcon:'ic_stat_haru',schedule:{at:n.when,allowWhileIdle:true}}))});
  }catch(e){console.warn('notif',e)}
}
async function setupNative(){
  if(!N)return;
  const LN=N.LocalNotifications;
  try{await LN.createChannel({id:'haru',name:'하루판 알림',description:'할일 요약, 출금일, 월급날 알림',importance:4,visibility:1})}catch(e){}
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted')p=await LN.requestPermissions();
    notifState=p.display==='granted'?'on':'off';
  }catch(e){notifState='off'}
  render();reschedule();
  try{
    N.App.addListener('resume',()=>{render();reschedule()});
    N.App.addListener('backButton',()=>{if(root.innerHTML)closeSheet();else if(tab!=='todo'){tab='todo';render()}else N.App.exitApp()});
  }catch(e){}
}

/* ---------- 이벤트 ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act, id=b.closest('[data-id]')?.dataset.id;
  if(act==='toggle'){
    const t=state.tasks.find(x=>x.id===id);if(!t)return;
    const before=scores(), tdB=dayStat(ymd(today)).got;
    if(!t.done){t.done=true;t.doneAt=ymd(today);t.pts=t.w}else{t.done=false;t.doneAt=null;t.pts=0}
    save();
    if(t.done){
      const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,t.w);
      b.closest('.task').classList.add('done');
      flyPoints(b,t.pts,()=>{const af=scores();render();
        const wk=document.getElementById('wkPts'),mo=document.getElementById('moPts');
        countUp(wk,before.wk,af.wk);countUp(mo,before.mo,af.mo);countUp(document.getElementById('tdPts'),tdB,dayStat(ymd(today)).got);
        if(wk){const r2=wk.getBoundingClientRect();burst(r2.left+30,r2.top+20,2)}});
    } else render();
  }
  else if(act==='editTask') taskSheet('task',state.tasks.find(x=>x.id===id));
  else if(act==='recList') recListSheet();
  else if(act==='goal') goalSheet();
  else if(act==='editFixed') fixedSheet(state.fixed.find(x=>x.id===id));
  else if(act==='editAcc') accSheet(state.accounts.find(x=>x.id===id));
  else if(act==='newAcc') accSheet(null);
  else if(act==='newPay') paySheet(null);
  else if(act==='editPay') paySheet(state.pays.find(x=>x.id===id));
  else if(act==='pay'){const key=b.dataset.key;state.paid[key]=1;
    const f=state.fixed.find(z=>key.endsWith(':'+z.id));
    if(f&&!state.spend.some(z=>z.fixedKey===key))state.spend.push({id:uid(),at:Date.now(),date:ymd(today),amount:f.amount,cat:'고정지출',memo:f.name,who:(f.scope||'공동')==='개인'?'나':'공동',pay:f.acc,fixedKey:key,ex:f.ex});
    save();const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,2);render();toast('출금 확인했어요')}
  else if(act==='backup') backupSheet();
  else if(act==='calendar'){calMonth=null;calSel=null;calendarSheet()}
  else if(act==='scope'){fixScope=b.dataset.v;render()}
  else if(act==='sub'){sub=b.dataset.v;render();scrollTo(0,0)}
  else if(act==='mPrev'||act==='mNext'){const cur=bookMonth||ymd(today).slice(0,7);const[y,m]=cur.split('-').map(Number);const d=new Date(y,m-1+(act==='mNext'?1:-1),1);bookMonth=ymd(d).slice(0,7);render()}
  else if(act==='editSpend') spendSheet(state.spend.find(x=>x.id===b.dataset.id));
  else if(act==='payList') payListSheet();
  else if(act==='notifPerm'){if(N)N.LocalNotifications.requestPermissions().then(p=>{notifState=p.display==='granted'?'on':'off';render();reschedule();if(notifState==='off')toast('휴대폰 설정 → 앱 → 나의 하루판 → 알림에서 켜 주세요')})}
  else if(act==='clearEx'){
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='한 번 더 누르면 삭제';return}
    const exRec=new Set(state.recs.filter(r=>r.ex).map(r=>r.id));
    state.tasks=state.tasks.filter(t=>!t.ex&&!exRec.has(t.recId));state.recs=state.recs.filter(r=>!r.ex);
    state.fixed=state.fixed.filter(f=>!f.ex);state.accounts=state.accounts.filter(a=>!a.ex);state.pays=state.pays.filter(p=>!p.ex);
    state.spend=state.spend.filter(x=>!x.ex);state.paid={};state.hasEx=false;save();render();toast('예시를 지웠어요');
  }
});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();scrollTo(0,0)}));
document.getElementById('fab').addEventListener('click',()=>tab==='todo'?taskSheet('new'):sub==='book'?spendSheet(null):fixedSheet(null));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(sod(new Date())-today)render()});
load().then(s=>{state=s;render();setupNative()});
})();
</script>
