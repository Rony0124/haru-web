<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>나의 하루판</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루판">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161A24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: 단일 열 모바일 앱. 상단 점수판(스코어보드) + 3일 할일 / 월급 사이클 중심의 가계 관리, 하단 탭바 + 추가 버튼 */
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --ink:#161A24; --muted:#687085; --line:#DCE0E9; --chip:#E3E7F0;
  --accent:#E9A400; --accent-soft:#FFF2CC; --money:#0B8A78; --money-soft:#DDF3EF; --danger:#D2433B; --danger-soft:#FBE3E1;
  --board:#161A24; --board-ink:#F4F5F9; --board-muted:#8A92A6; --board-line:#2A3040;
  --cat-brown:#A0663A; --cat-blue:#3A6FD8; --cat-pink:#D24C8C; --cat-purple:#7B5BD6; --cat-slate:#5C6478;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1118; --surface:#181C26; --ink:#ECEEF4; --muted:#8C93A6; --line:#283040; --chip:#222837;
  --accent:#FFC233; --accent-soft:#3A3014; --money:#3DC5AE; --money-soft:#123430; --danger:#FF6B62; --danger-soft:#3A1C1B;
  --board:#07090E; --board-ink:#F4F5F9; --board-muted:#7C8498; --board-line:#232938; --cat-brown:#D49A6A; --cat-blue:#6E9BFF; --cat-pink:#FF7DB5; --cat-purple:#A98BFF; --cat-slate:#9AA3B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1118; --surface:#181C26; --ink:#ECEEF4; --muted:#8C93A6; --line:#283040; --chip:#222837;
  --accent:#FFC233; --accent-soft:#3A3014; --money:#3DC5AE; --money-soft:#123430; --danger:#FF6B62; --danger-soft:#3A1C1B;
  --board:#07090E; --board-ink:#F4F5F9; --board-muted:#7C8498; --board-line:#232938; --cat-brown:#D49A6A; --cat-blue:#6E9BFF; --cat-pink:#FF7DB5; --cat-purple:#A98BFF; --cat-slate:#9AA3B8; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date-big{font-family:var(--f-display);font-size:26px;letter-spacing:.01em;line-height:1.1}
.date-sub{color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--money)}
.sync.saving i{background:var(--accent)}
.sync.err i{background:var(--danger)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--muted);flex:none}
.icon-btn svg{width:18px;height:18px}

/* 점수판 */
.board{background:var(--board);color:var(--board-ink);border-radius:18px;padding:18px;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:4px 12px}
.board .cell{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .cell+.cell{border-left:1px solid var(--board-line);padding-left:12px}
.board .lbl{font-size:11px;letter-spacing:.12em;color:var(--board-muted);font-weight:600}
.board .pts{font-family:var(--f-display);font-size:36px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;transition:transform .25s}
.board .pts small{font-size:14px;color:var(--board-muted);margin-left:3px}
.board .pts.today{color:var(--board-ink)}
.board .meta button{color:var(--board-muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:0}
.pp{color:var(--danger);font-weight:600}
.postpone{background:var(--danger-soft);color:var(--danger)}
.board .meta{font-size:12px;color:var(--board-muted)}
.board .pts.bump{transform:scale(1.14)}
.bar{grid-column:1/-1;margin-top:10px;height:6px;background:var(--board-line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
.bar-lbl{grid-column:1/-1;font-size:12px;color:var(--board-muted);display:flex;justify-content:space-between}
.bar-lbl button{color:var(--board-muted);font-size:12px;text-decoration:underline;text-underline-offset:3px}

/* 알림 띠 */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--money-soft);font-size:14px}
.alert.warn{background:var(--danger-soft)}
.alert.pay{background:var(--accent-soft)}
.alert b{font-weight:700}
.alert .tag{flex:none;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--money);color:var(--surface)}
.alert.warn .tag{background:var(--danger)}
.alert.pay .tag{background:var(--accent);color:var(--board)}
.alert .grow{flex:1;min-width:0}
.example-note{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 12px;border:1px dashed var(--line);border-radius:12px}
.example-note button{color:var(--danger);font-weight:600;font-size:13px}

/* 할일 */
.day{display:flex;flex-direction:column;gap:12px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px;gap:8px}
.day-h h2{font-size:17px;font-weight:700;margin:0}
.day-h .d{color:var(--muted);font-size:13px;margin-left:6px;font-weight:500}
.day-h .sum{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.list>.empty{background:var(--surface);border-radius:var(--r)}
.task{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--surface);border-radius:var(--r)}
.chk{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.chk svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .2s;color:var(--board)}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .chk svg{opacity:1;transform:scale(1)}
.task .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.task .t{font-weight:500;overflow-wrap:anywhere}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.task .m{font-size:12px;color:var(--muted);overflow-wrap:anywhere;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rep{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--muted)}
.late{color:var(--danger);font-weight:600}
.wt{flex:none;min-width:34px;text-align:center;font-size:12px;font-weight:700;padding:3px 7px;border-radius:8px;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums}
.wt.hi{background:var(--accent-soft);color:var(--ink)}
.wt.top{background:var(--accent);color:var(--board)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.foot-links{display:flex;justify-content:center;gap:18px}
.link-btn{font-size:13px;font-weight:600;color:var(--money)}
.foot-links .link-btn{color:var(--muted)}

/* 가계 */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;gap:8px}
.sec-h h2{font-size:17px;font-weight:700;margin:0}
.sec-h span{font-size:12px;color:var(--muted)}
.mboard{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mboard div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mboard .lbl{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.mboard .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mboard .v.money{color:var(--money)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 0;border-radius:9px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.spend-top{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav button{width:30px;height:30px;border-radius:8px;background:var(--chip);font-size:18px;line-height:1;color:var(--muted)}
.month-nav button:disabled{opacity:.35}
.month-nav b{font-size:14px;color:var(--muted);min-width:90px;text-align:center}
.spend-big{font-family:var(--f-display);font-size:34px;line-height:1.05}
.spend-sub{font-size:13px;color:var(--muted)}
.stack{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;background:var(--chip)}
.stack i{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend b{color:var(--ink);font-weight:600}
.spend{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border-radius:var(--r);text-align:left;width:100%}
.spend .dot{flex:none;width:10px;height:10px;border-radius:50%}
.spend .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.spend .t{font-weight:600;overflow-wrap:anywhere}
.spend .m{font-size:12px;color:var(--muted)}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.big-input{font-size:24px!important;font-weight:700;padding:12px 14px!important}
.cycle{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.cycle.now{background:var(--board);color:var(--board-ink)}
.cycle .route{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cycle.now .route{color:var(--board-muted)}
.cycle .route b{color:var(--ink);font-weight:700}
.cycle.now .route b{color:var(--board-ink)}
.cycle .big{font-family:var(--f-display);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.cycle.now .big{color:var(--accent)}
.cycle .big small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px;font-weight:500}
.cycle.now .big small{color:var(--board-muted)}
.cycle .rows{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.cycle.now .rows{border-color:var(--board-line)}
.cycle .r{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.cycle .r span:first-child{color:var(--muted)}
.cycle.now .r span:first-child{color:var(--board-muted)}
.cycle .net{font-size:13px;font-weight:700;padding:6px 10px;border-radius:9px;background:var(--money-soft);color:var(--money);text-align:center}
.cycle .net.bad{background:var(--danger-soft);color:var(--danger)}
.setup{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.setup p{margin:0;color:var(--muted);font-size:14px}
.pay{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--surface);border-radius:var(--r)}
.dday{flex:none;width:52px;text-align:center;border-radius:10px;padding:5px 0;background:var(--chip)}
.dday b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.dday span{font-size:11px;color:var(--muted)}
.dday.today{background:var(--money);color:var(--surface)}
.dday.today span{color:var(--surface)}
.dday.over{background:var(--danger);color:var(--surface)}
.dday.over span{color:var(--surface)}
.dday.payday{background:var(--accent);color:var(--board)}
.dday.payday span{color:var(--board)}
.pay .body{flex:1;min-width:0;text-align:left}
.pay .t{font-weight:600}
.pay .m{font-size:12px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.amt.plus{color:var(--money)}
.paybtn{flex:none;font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;background:var(--chip);color:var(--muted)}
.bank{padding:16px;background:var(--surface);border-radius:var(--r);display:flex;flex-direction:column;gap:10px}
.bank-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bank-name{font-weight:700}
.bank-row{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bank-row span:first-child{color:var(--muted)}
.verdict{font-size:13px;font-weight:700;padding:7px 10px;border-radius:9px;text-align:center}
.verdict.ok{background:var(--money-soft);color:var(--money)}
.verdict.bad{background:var(--danger-soft);color:var(--danger)}
.verdict.none{background:var(--chip);color:var(--muted);font-weight:500}
.bal-btn{font-size:13px;color:var(--money);font-weight:600}

/* 탭바 + FAB */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
nav.tabs button{padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
.fab{position:fixed;right:max(18px,calc(50% - 244px),calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--board);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:21}
.fab svg{width:26px;height:26px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;animation:up .22s ease-out;box-sizing:border-box}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{margin:0;font-size:18px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;box-sizing:border-box}
.field textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--money)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:8px 12px;border-radius:10px;background:var(--chip);font-size:14px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips.pts button{min-width:44px;display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:7px 8px}
.chips.pts button b{font-size:17px;font-variant-numeric:tabular-nums}
.chips.pts button span{font-size:10px;font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px}
.btn{flex:1;padding:13px;border-radius:12px;font-weight:700;background:var(--chip)}
.btn.primary{background:var(--accent);color:var(--board)}
.btn.money{background:var(--money);color:var(--surface)}
.btn.danger{background:var(--danger-soft);color:var(--danger);flex:0 0 auto;padding-inline:16px}
.hint{font-size:12px;color:var(--muted);margin:0}
.repbox{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;background:var(--bg);font-size:14px}
.err{font-size:13px;color:var(--danger);margin:0}
.rule{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .body{flex:1;min-width:0;text-align:left}
.rule .m{font-size:12px;color:var(--muted)}

/* 효과 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}
.fly{position:fixed;z-index:61;pointer-events:none;font-family:var(--f-display);font-size:24px;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;max-width:80%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:360px){.board{gap:4px 8px;padding:16px 14px}.board .cell+.cell{padding-left:8px}.board .pts{font-size:28px}.mboard .v{font-size:15px}.cycle .big{font-size:26px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="화면 전환"><div class="in" role="tablist">
  <button role="tab" id="tab-todo" aria-selected="true" data-tab="todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>할일</button>
  <button role="tab" id="tab-money" aria-selected="false" data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>가계</button>
</div></nav>
<button class="fab" id="fab" aria-label="추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<canvas id="fx"></canvas>
<div id="sheetRoot"></div>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
<script>
(function(){
const KEY='my-hub-v1';
/* 피보나치 점수 */
const PTS=[1,2,3,5,8,13];
const PTS_N={1:'사소',2:'가벼움',3:'보통',5:'중요',8:'아주 중요',13:'핵심'};
const FREQ={none:'반복 안 함',daily:'매일',weekly:'매주',monthly:'매달',yearly:'매년'};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffD=(a,b)=>Math.round((sod(a)-sod(b))/864e5);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const won=n=>(Math.round(n)||0).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const DOW=['일','월','화','수','목','금','토'];
const md=d=>`${d.getMonth()+1}/${d.getDate()}`;
const ptsClass=p=>p>=8?'top':p>=5?'hi':'';
const stepDown=p=>{const i=PTS.indexOf(p);return i>0?PTS[i-1]:1};
/* 미루기: 원래 날짜에 계획했던 점수는 그날 만점에 남기고, 다음 날로 옮기면서 점수를 한 단계 내린다 */
function postpone(t,toDate){
  t.hist=t.hist||[];t.hist.push({date:t.date,w:t.w});
  if(t.recId){state.skips[t.recId+':'+t.date]=1;t.recTitle=recText(recOf(t)||{});t.recId=null}
  t.w=stepDown(t.w);t.pp=(t.pp||0)+1;t.date=toDate;
}
/* 앱을 열지 않은 사이 지난 할일은 자동으로 미룬 것으로 처리 (매일 반복은 제외) */
function autoRoll(){
  const T=ymd(today);let n=0;
  state.tasks.forEach(t=>{
    if(t.done||t.date>=T)return;
    if(t.recId&&recOf(t)?.freq==='daily')return;
    while(t.date<T){const nx=ymd(addD(parse(t.date),1));postpone(t,nx);n++}
  });
  return n;
}
/* 날짜별 달성: 그날 계획했던 점수(미룬 것 포함) 대비 그날 계획대로 끝낸 점수 */
function dayStat(ds){
  let plan=0,got=0;
  state.tasks.forEach(t=>{
    (t.hist||[]).forEach(h=>{if(h.date===ds)plan+=h.w});
    if(t.date===ds){plan+=t.w;if(t.done)got+=t.pts||t.w}
  });
  return {plan,got,pct:plan?Math.round(got/plan*100):0};
}

function migrate(s){
  if(!s||typeof s!=='object')return null;
  if(s.v===1){
    const map={1:1,2:3,3:5,4:8};
    (s.tasks||[]).forEach(t=>{t.w=map[t.w]||3;if(t.done)t.pts=t.w});
    s.v=2;
  }
  if(s.v!==2)return null;
  s.tasks=s.tasks||[];s.recs=s.recs||[];s.skips=s.skips||{};s.accounts=s.accounts||[];
  s.fixed=s.fixed||[];s.spend=s.spend||[];s.paid=s.paid||{};s.pays=s.pays||[];s.goal=s.goal||50;s.updatedAt=s.updatedAt||0;
  // 1년 넘은 완료 할일은 정리
  const cut=ymd(addD(today,-400));
  s.tasks=s.tasks.filter(t=>!(t.done&&t.date<cut));
  return s;
}
/* 저장: 휴대폰 내부 저장소(Preferences)를 기본으로, 브라우저에서 열면 localStorage */
const N=window.HaruNative||null;
async function load(){
  let raw=null;
  if(N){try{raw=(await N.Preferences.get({key:KEY})).value}catch(e){}}
  if(!raw){try{raw=localStorage.getItem(KEY)}catch(e){}}
  try{const s=migrate(JSON.parse(raw));if(s)return s}catch(e){}
  return seed();
}
function saveLocal(){
  const json=JSON.stringify(state);
  if(N){N.Preferences.set({key:KEY,value:json}).catch(()=>{})}
  try{localStorage.setItem(KEY,json)}catch(e){}
}
function save(){state.updatedAt=Date.now();saveLocal();scheduleNotifs()}
state={v:2,tasks:[],recs:[],skips:{},accounts:[],fixed:[],paid:{},pays:[],goal:50,updatedAt:0};

/* ---------- 반복 할일 ---------- */
function recMatches(r,d){
  if(ymd(d)<r.start)return false;
  const day=d.getDate(),m=d.getMonth(),last=dim(d.getFullYear(),m);
  if(r.freq==='daily')return true;
  if(r.freq==='weekly')return (r.dows||[]).includes(d.getDay());
  if(r.freq==='monthly')return day===Math.min(r.dom,last);
  if(r.freq==='yearly')return m===r.mon-1&&day===Math.min(r.dom,last);
  return false;
}
function recText(r){
  if(r.freq==='daily')return '매일';
  if(r.freq==='weekly')return '매주 '+(r.dows||[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(d=>DOW[d]).join('·');
  if(r.freq==='monthly')return `매달 ${r.dom}일`;
  if(r.freq==='yearly')return `매년 ${r.mon}월 ${r.dom}일`;
  return '';
}
function materialize(){
  let changed=false;
  for(let i=0;i<3;i++){
    const d=addD(today,i),ds=ymd(d);
    state.recs.forEach(r=>{
      if(!recMatches(r,d)||state.skips[r.id+':'+ds])return;
      if(state.tasks.some(t=>t.recId===r.id&&t.date===ds))return;
      state.tasks.push({id:uid(),title:r.title,w:r.w,memo:r.memo,date:ds,done:false,recId:r.id,ex:r.ex});
      changed=true;
    });
  }
  if(autoRoll())changed=true;
  if(changed){state.updatedAt=Math.max(state.updatedAt,1);saveLocal()}
}
function recOf(t){return t.recId?state.recs.find(r=>r.id===t.recId):null}

/* ---------- 계산 ---------- */
function scores(){
  const ws=addD(today,-((today.getDay()+6)%7)), we=addD(ws,6);
  const mk=ymd(today).slice(0,7);
  let wk=0,mo=0,wkN=0,moN=0;
  state.tasks.forEach(t=>{if(!t.done||!t.doneAt)return;const d=parse(t.doneAt);
    if(d>=ws&&d<=we){wk+=t.pts;wkN++} if(t.doneAt.slice(0,7)===mk){mo+=t.pts;moN++}});
  return {wk,mo,wkN,moN,ws,we};
}
function dueIn(f,y,m){return new Date(y,m,Math.min(f.day,dim(y,m)))}
function occ(f){ // 아직 확인 안 한 가장 이른 출금 회차
  const y=today.getFullYear(),m=today.getMonth();
  for(let k=0;k<3;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());const key=ymd(d).slice(0,7)+':'+f.id;
    if(!state.paid[key])return {date:d,key,d:diffD(d,today)}}
  const dt=new Date(y,m+3,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
  return {date:d,key:ymd(d).slice(0,7)+':'+f.id,d:diffD(d,today)};
}
// [from, to) 사이에 빠질 출금 (확인 안 한 것만). withOverdue면 이번 달에 이미 지났는데 확인 안 한 것도 포함
function dueBetween(from,to,withOverdue){
  const out=[];const y=today.getFullYear(),m=today.getMonth();
  state.fixed.forEach(f=>{
    for(let k=0;k<4;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
      const key=ymd(d).slice(0,7)+':'+f.id; if(state.paid[key])continue;
      if((d>=from&&d<to)||(withOverdue&&k===0&&d<today))out.push({f,date:d,key});}
  });
  return out.sort((a,b)=>a.date-b.date);
}
function payDate(p,y,m){
  const dt=new Date(y,m,1);let d=new Date(dt.getFullYear(),dt.getMonth(),Math.min(p.day,dim(dt.getFullYear(),dt.getMonth())));
  if(p.shift){while(d.getDay()===0||d.getDay()===6)d=addD(d,-1)}
  return d;
}
function payEvents(){
  const ev=[];const y=today.getFullYear(),m=today.getMonth();
  for(let k=-1;k<=3;k++)state.pays.forEach(p=>ev.push({p,date:payDate(p,y,m+k)}));
  return ev.sort((a,b)=>a.date-b.date);
}
function accName(id){const a=state.accounts.find(a=>a.id===id);return a?a.name:'은행 미지정'}
function byBank(list){const g={};list.forEach(x=>{const k=x.f.acc;g[k]=(g[k]||0)+x.f.amount});return g}

  </section>`;
  h+=alertsView();

    list.sort((a,b)=>(a.done-b.done)||(b.w-a.w));

      <span class="sum num">${st.plan?(i===0?`${st.got}/${st.plan}점 · 남은 ${left.length}개`:`만점 ${st.plan}점`):''}</span></div>

  }
  h+=`<div class="foot-links"><button class="link-btn" data-act="recList">반복 할일 관리 (${state.recs.length})</button></div>`;
  return h;
}
function taskRow(t){
  const r=recOf(t);
  const orig=t.hist&&t.hist.length?t.hist[0].w:null;
  const meta=[r?`<span class="rep">${esc(recText(r))}</span>`:t.recTitle?`<span class="rep">${esc(t.recTitle)}</span>`:'',t.pp?`<span class="pp">미룸 ${t.pp}회 · 원래 ${orig}점</span>`:'',t.memo?`<span>${esc(t.memo)}</span>`:''].filter(Boolean).join('');
  return `<div class="task${t.done?' done':''}" data-id="${t.id}">
    <button class="chk" data-act="toggle" aria-label="${t.done?'완료 취소':'완료'}" aria-pressed="${t.done}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></button>
    <button class="body" data-act="editTask"><span class="t">${esc(t.title)}</span>${meta?`<span class="m">${meta}</span>`:''}</button>
    <span class="wt ${ptsClass(t.w)}">+${t.w}</span></div>`;
}
function alertsView(){
  const out=[];
  payEvents().filter(e=>diffD(e.date,today)===0).forEach(e=>out.push(`<div class="alert pay"><span class="tag">월급날</span><span class="grow"><b>${esc(e.p.name)}</b>${e.p.amount?' '+won(e.p.amount):''}${e.p.acc?' → '+esc(accName(e.p.acc)):''}</span></div>`));
  state.fixed.map(f=>({f,o:occ(f)})).filter(x=>x.o.d<=1).sort((a,b)=>a.o.d-b.o.d).forEach(({f,o})=>{
    const lab=o.d<0?'확인 필요':o.d===0?'오늘 출금':'내일 출금';
    out.push(`<div class="alert${o.d<0?' warn':''}"><span class="tag">${lab}</span><span class="grow"><b>${esc(f.name)}</b> ${won(f.amount)} · ${esc(accName(f.acc))}</span></div>`)});
  return out.length?`<div class="alerts">${out.join('')}</div>`:'';
}

        const meta=[x.who&&x.who!=='나'?x.who:'',x.pay?accName(x.pay):''].filter(Boolean).map(esc).join(' · ');
        return `<button class="spend" data-act="editSpend" data-id="${x.id}"><span class="dot" style="background:${catVar(x.cat)}"></span>
          <span class="body"><span class="t">${esc(x.memo||x.cat)}</span><span class="m">${esc(x.cat)}${meta?' · '+meta:''}</span></span>
          <span class="amt num">${won(x.amount)}</span></button>`}).join('')+`</div></section>`;
  });
  return h;
}
function fixedView(){
  const total=state.fixed.reduce((s,f)=>s+f.amount,0);
  const ym=ymd(today).slice(0,7);
  const paidAmt=state.fixed.filter(f=>state.paid[ym+':'+f.id]).reduce((s,f)=>s+f.amount,0);
  let h=`<section class="mboard"><div><span class="lbl">월 고정지출</span><span class="v">${won(total)}</span></div>
    <div><span class="lbl">이번 달 출금됨</span><span class="v">${won(paidAmt)}</span></div>
    <div><span class="lbl">이번 달 남음</span><span class="v money">${won(total-paidAmt)}</span></div></section>`;
  h+=alertsView();

  // 출금 일정
  const occs=state.fixed.map(f=>({f,o:occ(f)})).sort((a,b)=>a.o.date-b.o.date);
  h+=`<section class="day"><div class="sec-h"><h2>출금 일정</h2><span>빠져나가면 '출금 확인' → 가계부에 기록</span></div><div class="list">`;
  h+=occs.length?occs.map(({f,o})=>{
    const cls=o.d<0?'over':o.d===0?'today':'';
    const top=o.d<0?'지남':o.d===0?'오늘':'D-'+o.d;
    return `<div class="pay" data-id="${f.id}"><div class="dday ${cls}"><b>${top}</b><span class="num">${md(o.date)}</span></div>
      <button class="body" data-act="editFixed"><div class="t">${esc(f.name)}</div><div class="m">${esc(accName(f.acc))} · 매월 ${f.day}일</div></button>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="amt">${won(f.amount)}</span>
      ${o.d<=3?`<button class="paybtn" data-act="pay" data-key="${o.key}">출금 확인</button>`:''}</div></div>`}).join('')
    :`<div class="empty">고정지출이 없어요. + 버튼으로 월세, 통신비 같은 항목을 넣어 주세요.</div>`;
  h+=`</div></section>`;

  // 은행별 준비 금액: 다음 월급 전까지 (월급날이 없으면 30일)
  const nx=payEvents().find(e=>e.date>today);
  const basisTo=nx?nx.date:addD(today,31);
  const basisLbl=nx?`다음 월급 ${md(nx.date)} 전까지`:'앞으로 30일';
  const need=dueBetween(today,basisTo,true);
  h+=`<section class="day"><div class="sec-h"><h2>은행별 준비 금액</h2><span>${basisLbl}</span></div><div class="list">`;
  const accs=state.accounts.slice();
  if(state.fixed.some(f=>!state.accounts.find(a=>a.id===f.acc))) accs.push({id:'_none',name:'은행 미지정',bal:null,virtual:1});
  const shown=accs.filter(a=>a.virtual||state.fixed.some(f=>f.acc===a.id)||a.bal!=null);
  h+=shown.length?shown.map(a=>{
    const due=need.filter(x=>a.virtual?!state.accounts.find(z=>z.id===x.f.acc):x.f.acc===a.id);
    const sum=due.reduce((s,x)=>s+x.f.amount,0);
    let v;
    if(a.bal==null) v=`<div class="verdict none">잔액을 넣으면 부족한 금액을 알려 드려요</div>`;
    else{const r=a.bal-sum; v=r>=0?`<div class="verdict ok">출금 후 ${won(r)} 남아요</div>`:`<div class="verdict bad">${won(-r)} 부족해요 · 이체 필요</div>`}
    return `<div class="bank" data-id="${a.id}"><div class="bank-top"><span class="bank-name">${esc(a.name)}</span>${a.virtual?'':`<button class="bal-btn" data-act="editAcc">${a.bal==null?'잔액 입력':'잔액 '+won(a.bal)}</button>`}</div>
      <div class="bank-row"><span>빠져나갈 돈 ${due.length}건</span><span class="amt">${won(sum)}</span></div>
      ${v}</div>`}).join(''):`<div class="empty">고정지출에 은행을 정하면 여기에 정리돼요.</div>`;
  h+=`</div></section>`;
  h+=`<div class="foot-links"><button class="link-btn" data-act="payList">월급날 설정 (${state.pays.length})</button><button class="link-btn" data-act="newAcc">은행 추가</button></div>`;
  return h;
}

        if(isNew){state.spend.push({id:uid(),at:Date.now(),...data});state.lastCat=data.cat;state.lastWho=data.who;state.lastPay=data.pay}
        else Object.assign(x,data);
        if(data.date.slice(0,7)!==ymd(today).slice(0,7))bookMonth=data.date.slice(0,7);

/* ---------- 시트 ---------- */
const root=document.getElementById('sheetRoot');
function openSheet(html,onMount){
  root.innerHTML=`<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('.scrim').addEventListener('click',e=>{if(e.target.dataset.close)closeSheet()});
  const sheet=root.querySelector('.sheet');
  sheet.querySelectorAll('[data-x]').forEach(b=>b.onclick=closeSheet);
  onMount&&onMount(sheet);
  const f=sheet.querySelector('input:not([type=checkbox]),textarea');f&&setTimeout(()=>f.focus(),60);
}
function closeSheet(){root.innerHTML=''}
function chipsSel(sheet,name){const b=sheet.querySelector(`[data-group="${name}"] [aria-pressed="true"]`);return b?b.dataset.v:null}
function chipsMulti(sheet,name){return [...sheet.querySelectorAll(`[data-group="${name}"] [aria-pressed="true"]`)].map(b=>b.dataset.v)}
function bindChips(sheet,onChange){
  sheet.querySelectorAll('[data-group]').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();
    if(g.dataset.multi){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')}
    else g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    onChange&&onChange(g.dataset.group)}));
}
function confirmBtn(btn,fn){btn.onclick=()=>{if(btn.dataset.sure)fn();else{btn.dataset.sure=1;btn.textContent='한 번 더 누르면 삭제'}}}
const ptsChips=cur=>`<div class="chips pts" data-group="w">${PTS.map(p=>`<button type="button" data-v="${p}" aria-pressed="${p===cur}"><b>${p}</b><span>${PTS_N[p]}</span></button>`).join('')}</div>`;
const dayOpts=(sel)=>Array.from({length:31},(_,i)=>`<option value="${i+1}"${sel===i+1?' selected':''}>${i+1}일</option>`).join('');

/* 할일 시트. mode: new | task | rule */
function taskSheet(mode,obj){
  const T=ymd(today);
  const t=mode==='task'?obj:null, rule=mode==='rule'?obj:(t?recOf(t):null);
  const src=mode==='rule'?rule:t;
  const curW=src?src.w:3;
  const curDate=t?t.date:T;
  const dates=[[T,'오늘'],[ymd(addD(today,1)),'내일'],[ymd(addD(today,2)),'모레']];
  const dateOpts=dates.some(d=>d[0]===curDate)?dates:[[curDate,md(parse(curDate))],...dates];
  const showRepeat=mode!=='task';
  const r0=mode==='rule'?rule:{freq:'none',dows:[today.getDay()],dom:today.getDate(),mon:today.getMonth()+1};
  const title=mode==='new'?'할일 추가':mode==='rule'?'반복 할일 고치기':'할일 고치기';
  openSheet(`<h3>${title}</h3>
    <form id="tf" class="form">
      <div class="field"><label for="t-title">할일</label><input id="t-title" maxlength="80" value="${esc(src?.title)}" placeholder="예: 은행 서류 제출"></div>
      <div class="field"><span class="lab">점수 (중요할수록 크게)</span>${ptsChips(curW)}</div>
      ${showRepeat?`<div class="field"><span class="lab">반복</span><div class="chips" data-group="freq">${Object.keys(FREQ).filter(k=>mode==='new'||k!=='none').map(k=>`<button type="button" data-v="${k}" aria-pressed="${k===r0.freq}">${FREQ[k]}</button>`).join('')}</div></div>
        <div class="field" id="g-dow"><span class="lab">요일 (여러 개 가능)</span><div class="chips" data-group="dow" data-multi="1">${[1,2,3,4,5,6,0].map(d=>`<button type="button" data-v="${d}" aria-pressed="${(r0.dows||[]).includes(d)}">${DOW[d]}</button>`).join('')}</div></div>
        <div class="row2" id="g-dom"><div class="field" id="g-mon"><label for="t-mon">월</label><select id="t-mon">${Array.from({length:12},(_,i)=>`<option value="${i+1}"${r0.mon===i+1?' selected':''}>${i+1}월</option>`).join('')}</select></div>
          <div class="field"><label for="t-dom">날짜</label><select id="t-dom">${dayOpts(r0.dom||today.getDate())}</select></div></div>`
      :''}
      <div class="field" id="g-date"><span class="lab">언제</span><div class="chips" data-group="date">${dateOpts.map(([v,n])=>`<button type="button" data-v="${v}" aria-pressed="${v===curDate}">${n}</button>`).join('')}</div></div>
      ${mode==='task'&&rule?`<div class="repbox"><span>${esc(recText(rule))} 반복 중</span><button type="button" class="link-btn" id="t-rule">반복 규칙 고치기</button></div>`:''}
      ${mode==='task'&&!t.done?`<button type="button" class="btn postpone" id="t-pp">내일로 미루기 · ${t.w}점 → ${stepDown(t.w)}점</button><p class="hint">미루면 오늘 달성률에서 빠지고, 내일 받을 점수가 한 단계 줄어요.</p>`:''}
      <div class="field"><label for="t-memo">메모 (선택)</label><input id="t-memo" maxlength="120" value="${esc(src?.memo)}"></div>
      ${mode==='task'&&rule?'<p class="hint">이름·점수·메모를 바꾸면 앞으로 생길 반복 할일에도 적용돼요.</p>':''}
      <p class="err" id="t-err" hidden></p>
      <div class="actions">${mode==='new'?'':'<button type="button" class="btn danger" id="t-del">삭제</button>'}<button type="button" class="btn" data-x>취소</button><button class="btn primary">${mode==='new'?'추가':'저장'}</button></div>
    </form>`,sheet=>{
      const sync=()=>{if(!showRepeat)return;const f=chipsSel(sheet,'freq');
        sheet.querySelector('#g-dow').hidden=f!=='weekly';
        sheet.querySelector('#g-dom').hidden=!(f==='monthly'||f==='yearly');
        sheet.querySelector('#g-mon').hidden=f!=='yearly';
        sheet.querySelector('#g-date').hidden=f!=='none';};
      bindChips(sheet,sync);sync();
      if(mode==='rule')sheet.querySelector('#g-date').hidden=true;
      const rb=sheet.querySelector('#t-rule');if(rb)rb.onclick=()=>taskSheet('rule',rule);
      const pb=sheet.querySelector('#t-pp');
      if(pb)pb.onclick=()=>{const from=t.w;postpone(t,ymd(addD(parse(t.date),1)));save();closeSheet();render();toast(`내일로 미뤘어요 · ${from}점 → ${t.w}점`)};
      const del=sheet.querySelector('#t-del');
      if(del)confirmBtn(del,()=>{
        if(mode==='rule'){state.recs=state.recs.filter(r=>r.id!==rule.id);state.tasks=state.tasks.filter(x=>!(x.recId===rule.id&&!x.done&&x.date>=T))}
        else{if(t.recId)state.skips[t.recId+':'+t.date]=1;state.tasks=state.tasks.filter(x=>x.id!==t.id)}
        save();closeSheet();render();toast(mode==='rule'?'반복 할일을 없앴어요':'삭제했어요')});
      sheet.querySelector('#tf').addEventListener('submit',e=>{e.preventDefault();
        const err=sheet.querySelector('#t-err');
        const ttl=sheet.querySelector('#t-title').value.trim();
        if(!ttl){err.textContent='할일 내용을 적어 주세요.';err.hidden=false;return}
        const w=+chipsSel(sheet,'w'), memo=sheet.querySelector('#t-memo').value.trim();
        const freq=showRepeat?chipsSel(sheet,'freq'):'none';
        let sched=null;
        if(freq!=='none'){
          sched={freq};
          if(freq==='weekly'){sched.dows=chipsMulti(sheet,'dow').map(Number);if(!sched.dows.length){err.textContent='반복할 요일을 하나 이상 골라 주세요.';err.hidden=false;return}}
          if(freq==='monthly'||freq==='yearly')sched.dom=+sheet.querySelector('#t-dom').value;
          if(freq==='yearly')sched.mon=+sheet.querySelector('#t-mon').value;
        }
        if(mode==='new'){
          if(sched){state.recs.push({id:uid(),title:ttl,w,memo,start:T,...sched})}
          else state.tasks.push({id:uid(),title:ttl,w,memo,date:chipsSel(sheet,'date'),done:false});
          save();closeSheet();render();toast(sched?'반복 할일을 만들었어요':'할일을 추가했어요');return;
        }
        if(mode==='rule'){
          const changedSched=JSON.stringify([rule.freq,rule.dows,rule.dom,rule.mon])!==JSON.stringify([sched.freq,sched.dows,sched.dom,sched.mon]);
          delete rule.dows;delete rule.dom;delete rule.mon;
          Object.assign(rule,{title:ttl,w,memo},sched);
          if(changedSched)state.tasks=state.tasks.filter(x=>!(x.recId===rule.id&&!x.done&&x.date>=T));
          else state.tasks.forEach(x=>{if(x.recId===rule.id&&!x.done&&x.date>=T)Object.assign(x,{title:ttl,w,memo})});
          save();closeSheet();render();toast('반복 할일을 고쳤어요');return;
        }
        // 일반 할일 수정
        const nd=chipsSel(sheet,'date');
        if(t.recId&&nd!==t.date){state.skips[t.recId+':'+t.date]=1;t.recId=null}
        Object.assign(t,{title:ttl,w,memo,date:nd}); if(t.done)t.pts=w;
        if(rule&&t.recId){Object.assign(rule,{title:ttl,w,memo});state.tasks.forEach(x=>{if(x.recId===rule.id&&!x.done&&x.date>=T)Object.assign(x,{title:ttl,w,memo})})}
        save();closeSheet();render();toast('저장했어요');
      });
    });
}

function fmtInput(el){el.addEventListener('input',()=>{const n=el.value.replace(/[^\d]/g,'');el.value=n?(+n).toLocaleString('ko-KR'):''})}
function accSelect(id,sel,allowNone){

    <input id="${id}-new" maxlength="20" placeholder="은행 이름 (예: 우리은행)" hidden>`;
}
function bindAcc(sheet,id){const s=sheet.querySelector('#'+id),n=sheet.querySelector('#'+id+'-new');const f=()=>{n.hidden=s.value!=='_new'};s.onchange=f;f()}
function readAcc(sheet,id){const s=sheet.querySelector('#'+id);if(s.value!=='_new')return {id:s.value};
  const n=sheet.querySelector('#'+id+'-new').value.trim();if(!n)return {err:'은행 이름을 적어 주세요.'};
  const ex=state.accounts.find(a=>a.name===n);if(ex)return {id:ex.id};const nid=uid();state.accounts.push({id:nid,name:n,bal:null});return {id:nid}}
function fixedSheet(f){
  const isNew=!f;
  openSheet(`<h3>${isNew?'고정지출 추가':'고정지출 고치기'}</h3>
    <form id="ff" class="form">
      <div class="field"><label for="f-name">항목</label><input id="f-name" maxlength="40" value="${esc(f?.name)}" placeholder="예: 월세, 통신비, 보험"></div>
      <div class="row2"><div class="field"><label for="f-amt">금액 (원)</label><input id="f-amt" inputmode="numeric" class="num" value="${f?f.amount.toLocaleString('ko-KR'):''}" placeholder="0"></div>
      <div class="field"><label for="f-day">매월 출금일</label><select id="f-day">${dayOpts(f?f.day:25)}</select></div></div>
      <div class="field"><label for="f-acc">출금 은행</label>${accSelect('f-acc',f?.acc,false)}</div>
      <p class="hint">31일처럼 없는 날은 그 달 마지막 날로 계산해요.</p>
      <p class="err" id="f-err" hidden></p>
      <div class="actions">${isNew?'':'<button type="button" class="btn danger" id="f-del">삭제</button>'}<button type="button" class="btn" data-x>취소</button><button class="btn money">${isNew?'추가':'저장'}</button></div>
    </form>`,sheet=>{
      bindAcc(sheet,'f-acc');fmtInput(sheet.querySelector('#f-amt'));
      const del=sheet.querySelector('#f-del');
      if(del)confirmBtn(del,()=>{state.fixed=state.fixed.filter(x=>x.id!==f.id);save();closeSheet();render();toast('삭제했어요')});
      sheet.querySelector('#ff').addEventListener('submit',e=>{e.preventDefault();
        const err=sheet.querySelector('#f-err');const bad=m=>{err.textContent=m;err.hidden=false};
        const name=sheet.querySelector('#f-name').value.trim();
        const amount=+sheet.querySelector('#f-amt').value.replace(/[^\d]/g,'');
        if(!name)return bad('항목 이름을 적어 주세요.');
        if(!amount)return bad('금액을 적어 주세요.');
        const a=readAcc(sheet,'f-acc');if(a.err)return bad(a.err);
        const data={name,amount,day:+sheet.querySelector('#f-day').value,acc:a.id};
        if(isNew)state.fixed.push({id:uid(),...data});else Object.assign(f,data);
        save();closeSheet();render();toast(isNew?'고정지출을 추가했어요':'저장했어요');
      });
    });
}
function paySheet(p){

  openSheet(`<h3>${isNew?'월급날 추가':'월급날 고치기'}</h3>
    <form id="pf" class="form">
      <div class="field"><label for="p-name">이름</label><input id="p-name" maxlength="20" value="${esc(p?.name)}" placeholder="예: 내 월급, 와이프 월급"></div>
      <div class="row2"><div class="field"><label for="p-day">매월 입금일</label><select id="p-day">${dayOpts(p?p.day:25)}</select></div>
      <div class="field"><label for="p-amt">금액 (선택)</label><input id="p-amt" inputmode="numeric" class="num" value="${p&&p.amount?p.amount.toLocaleString('ko-KR'):''}" placeholder="0"></div></div>
      <div class="field"><label for="p-acc">들어오는 은행</label>${accSelect('p-acc',p?.acc,true)}</div>
      <label class="check"><input type="checkbox" id="p-shift" ${!p||p.shift?'checked':''}> 주말이면 직전 금요일에 들어와요</label>

      <div class="actions">${isNew?'':'<button type="button" class="btn danger" id="p-del">삭제</button>'}<button type="button" class="btn" data-x>취소</button><button class="btn primary">${isNew?'추가':'저장'}</button></div>
    </form>`,sheet=>{
      bindAcc(sheet,'p-acc');fmtInput(sheet.querySelector('#p-amt'));
      const del=sheet.querySelector('#p-del');
      if(del)confirmBtn(del,()=>{state.pays=state.pays.filter(x=>x.id!==p.id);save();closeSheet();render()});
      sheet.querySelector('#pf').addEventListener('submit',e=>{e.preventDefault();
        const err=sheet.querySelector('#p-err');
        const name=sheet.querySelector('#p-name').value.trim();if(!name){err.textContent='이름을 적어 주세요.';err.hidden=false;return}

        const data={name,day:+sheet.querySelector('#p-day').value,acc:a.id||null,amount:raw?+raw:null,shift:sheet.querySelector('#p-shift').checked};
        if(isNew)state.pays.push({id:uid(),...data});else Object.assign(p,data);
        save();closeSheet();render();toast(isNew?'월급날을 추가했어요':'저장했어요');
      });
    });
}
function accSheet(a){
  const isNew=!a;
  openSheet(`<h3>${isNew?'은행 추가':esc(a.name)}</h3>
    <form id="af" class="form">
      ${isNew?`<div class="field"><label for="a-name">은행 이름</label><input id="a-name" maxlength="20" placeholder="예: 하나은행"></div>`:''}
      <div class="field"><label for="a-bal">현재 잔액 (원, 비워 두면 계산 안 함)</label><input id="a-bal" inputmode="numeric" class="num" value="${a&&a.bal!=null?a.bal.toLocaleString('ko-KR'):''}"></div>

    </form>`,sheet=>{
      fmtInput(sheet.querySelector('#a-bal'));
      const del=sheet.querySelector('#a-del');
      if(del)confirmBtn(del,()=>{state.accounts=state.accounts.filter(x=>x.id!==a.id);save();closeSheet();render()});

        const raw=sheet.querySelector('#a-bal').value.replace(/[^\d]/g,'');const bal=raw===''?null:+raw;

function backupSheet(){
  const json=JSON.stringify(state);
  openSheet(`<h3>백업과 복원</h3>
    <p class="hint">데이터는 이 휴대폰 안에만 저장돼요. 앱을 지우거나 휴대폰을 바꾸기 전에 백업을 복사해 메모앱 같은 곳에 붙여 두세요. 예전 웹 버전의 백업도 여기에 붙여 넣으면 그대로 옮겨져요.</p>
    <div class="field"><label for="b-text">수동 백업 데이터</label><textarea id="b-text">${esc(json)}</textarea></div>
    <p class="err" id="b-err" hidden></p>
    <div class="actions"><button class="btn" id="b-copy">복사</button><button class="btn primary" id="b-restore">붙여넣은 내용으로 복원</button></div>
    <div class="actions"><button class="btn" data-x>닫기</button></div>`,sheet=>{
      const ta=sheet.querySelector('#b-text');
      sheet.querySelector('#b-copy').onclick=()=>{
        try{navigator.clipboard.writeText(json).then(()=>toast('백업을 복사했어요'),()=>{ta.select();toast('선택된 내용을 직접 복사해 주세요')})}catch(e){ta.select();toast('선택된 내용을 직접 복사해 주세요')}};
      const rb=sheet.querySelector('#b-restore');
      rb.onclick=()=>{const err=sheet.querySelector('#b-err');
        try{const s=migrate(JSON.parse(ta.value));if(!s)throw 0;
          if(!rb.dataset.sure){rb.dataset.sure=1;rb.textContent='지금 데이터를 덮어써요. 한 번 더 누르기';return}
          state=s;save();closeSheet();render();toast('복원했어요')}
        catch(e){err.textContent='백업 형식이 아니에요. 이 화면에서 복사한 내용 전체를 붙여 넣어 주세요.';err.hidden=false}};
    });
}

/* ---------- 효과 ---------- */
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
resize();addEventListener('resize',resize);
function burst(x,y,size){
  if(reduce)return;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--accent','--money','--danger','--muted'].map(v=>cs.getPropertyValue(v).trim());
  const n=Math.min(90,18+size*5);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*(3+size*.35);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,life:1,c:cols[i%cols.length],r:2+Math.random()*3,rot:Math.random()*6,sq:Math.random()<.5})}
  if(!raf)tick();
}
function tick(){
  const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.98;p.life-=.018;p.rot+=.2;
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);
    if(p.sq)cx.fillRect(-p.r*d,-p.r*d/2,p.r*2*d,p.r*d);else{cx.beginPath();cx.arc(0,0,p.r*d,0,7);cx.fill()}cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):0;
}
function countUp(el,from,to){
  if(!el)return;if(reduce){el.firstChild.nodeValue=to;return}
  const t0=performance.now(),dur=600;
  (function step(t){const k=Math.min(1,(t-t0)/dur);el.firstChild.nodeValue=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)})(t0);
  el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),260);
}
function flyPoints(fromEl,pts,onEnd){
  const target=document.getElementById('wkPts');
  if(reduce||!target){onEnd();return}
  const a=fromEl.getBoundingClientRect(),b=target.getBoundingClientRect();
  const s=document.createElement('span');s.className='fly';s.textContent='+'+pts;
  s.style.left=a.left+'px';s.style.top=a.top+'px';document.body.appendChild(s);
  const dx=b.left+20-a.left,dy=b.top+10-a.top;
  const an=s.animate([{transform:'translate(0,0) scale(.6)',opacity:0},{transform:'translate(0,-28px) scale(1.25)',opacity:1,offset:.25},{transform:`translate(${dx}px,${dy}px) scale(.8)`,opacity:.9}],{duration:750,easing:'cubic-bezier(.5,0,.3,1)'});
  an.onfinish=()=>{s.remove();onEnd()};
}
let toastT;
function toast(msg){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),1800)}

/* ---------- 휴대폰 알림 (기기에서 직접 울림, 인터넷 불필요) ---------- */
let notifT;
function scheduleNotifs(){clearTimeout(notifT);notifT=setTimeout(reschedule,800)}
function at(d,h,m){const x=new Date(d);x.setHours(h,m,0,0);return x}
function tasksOn(ds,i){
  const d=parse(ds);
  const list=state.tasks.filter(t=>t.date===ds&&!t.done);
  state.recs.forEach(r=>{
    if(!recMatches(r,d)||state.skips[r.id+':'+ds])return;
    if(state.tasks.some(t=>t.recId===r.id&&t.date===ds))return;
    list.push({title:r.title,w:r.w});
  });
  const late=state.tasks.filter(t=>t.date===ds&&!t.done&&t.pp).length;
  return {list:list.sort((a,b)=>b.w-a.w),late};
}
function buildNotifs(){
  const now=new Date(), out=[];
  // 아침 할일 요약 (07:30)
  for(let i=0;i<7;i++){
    const d=addD(today,i), when=at(d,7,30); if(when<=now)continue;
    const {list,late}=tasksOn(ymd(d),i);
    if(!list.length&&!late)continue;
    const pts=list.reduce((s,t)=>s+t.w,0);
    out.push({id:1000+i,title:`오늘 할일 ${list.length}개 · +${pts}점`,
      body:list.slice(0,3).map(t=>'· '+t.title).join('\n')+(list.length>3?`\n외 ${list.length-3}개`:'')+(late?`\n그중 미룬 할일 ${late}개`:''),when});
  }
  // 고정지출: 전날 20:00, 당일 08:00
  let fid=2000;const y=today.getFullYear(),m=today.getMonth();
  state.fixed.forEach(f=>{
    for(let k=0;k<3;k++){const dt=new Date(y,m+k,1);const d=dueIn(f,dt.getFullYear(),dt.getMonth());
      if(state.paid[ymd(d).slice(0,7)+':'+f.id])continue;
      const line=`${f.name} ${won(f.amount)} · ${accName(f.acc)}`;
      const eve=at(addD(d,-1),20,0), morn=at(d,8,0);
      if(eve>now)out.push({id:fid++,title:'내일 출금 예정',body:line+'\n잔액을 확인해 두세요',when:eve});
      if(morn>now)out.push({id:fid++,title:'오늘 출금일',body:line,when:morn});
    }
  });
  // 월급날 08:05
  let pid=4000;
  payEvents().forEach(e=>{const when=at(e.date,8,5);if(when<=now||diffD(e.date,today)>70)return;
    out.push({id:pid++,title:`오늘 ${e.p.name} 월급날`,body:(e.p.amount?won(e.p.amount):'')+(e.p.acc?' → '+accName(e.p.acc):''),when});});
  return out.sort((a,b)=>a.when-b.when).slice(0,60);
}
async function reschedule(){
  if(!N)return;
  const LN=N.LocalNotifications;
  try{
    const perm=await LN.checkPermissions();
    if(perm.display!=='granted'){notifState='off';return}
    notifState='on';
    const pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const list=buildNotifs();
    if(list.length)await LN.schedule({notifications:list.map(n=>({id:n.id,title:n.title,body:n.body,largeBody:n.body,channelId:'haru',smallIcon:'ic_stat_haru',schedule:{at:n.when,allowWhileIdle:true}}))});
  }catch(e){console.warn('notif',e)}
}
async function setupNative(){
  if(!N)return;
  const LN=N.LocalNotifications;
  try{await LN.createChannel({id:'haru',name:'하루판 알림',description:'할일 요약, 출금일, 월급날 알림',importance:4,visibility:1})}catch(e){}
  try{
    let p=await LN.checkPermissions();
    if(p.display!=='granted')p=await LN.requestPermissions();
    notifState=p.display==='granted'?'on':'off';
  }catch(e){notifState='off'}
  render();reschedule();
  try{
    N.App.addListener('resume',()=>{render();reschedule()});
    N.App.addListener('backButton',()=>{if(root.innerHTML)closeSheet();else if(tab!=='todo'){tab='todo';render()}else N.App.exitApp()});
  }catch(e){}
}

/* ---------- 이벤트 ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act, id=b.closest('[data-id]')?.dataset.id;
  if(act==='toggle'){
    const t=state.tasks.find(x=>x.id===id);if(!t)return;
    const before=scores(), tdB=dayStat(ymd(today)).got;
    if(!t.done){t.done=true;t.doneAt=ymd(today);t.pts=t.w}else{t.done=false;t.doneAt=null;t.pts=0}
    save();
    if(t.done){
      const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,t.w);
      b.closest('.task').classList.add('done');
      flyPoints(b,t.pts,()=>{const af=scores();render();
        const wk=document.getElementById('wkPts'),mo=document.getElementById('moPts');
        countUp(wk,before.wk,af.wk);countUp(mo,before.mo,af.mo);countUp(document.getElementById('tdPts'),tdB,dayStat(ymd(today)).got);
        if(wk){const r2=wk.getBoundingClientRect();burst(r2.left+30,r2.top+20,2)}});
    } else render();
  }
  else if(act==='editTask') taskSheet('task',state.tasks.find(x=>x.id===id));
  else if(act==='recList') recListSheet();
  else if(act==='goal') goalSheet();
  else if(act==='editFixed') fixedSheet(state.fixed.find(x=>x.id===id));
  else if(act==='editAcc') accSheet(state.accounts.find(x=>x.id===id));
  else if(act==='newAcc') accSheet(null);
  else if(act==='newPay') paySheet(null);
  else if(act==='editPay') paySheet(state.pays.find(x=>x.id===id));
  else if(act==='pay'){const key=b.dataset.key;state.paid[key]=1;
    const f=state.fixed.find(z=>key.endsWith(':'+z.id));
    if(f&&!state.spend.some(z=>z.fixedKey===key))state.spend.push({id:uid(),at:Date.now(),date:ymd(today),amount:f.amount,cat:'고정지출',memo:f.name,who:'',pay:f.acc,fixedKey:key,ex:f.ex});
    save();const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,2);render();toast('출금 확인했어요')}
  else if(act==='backup') backupSheet();
  else if(act==='sub'){sub=b.dataset.v;render();scrollTo(0,0)}
  else if(act==='mPrev'||act==='mNext'){const cur=bookMonth||ymd(today).slice(0,7);const[y,m]=cur.split('-').map(Number);const d=new Date(y,m-1+(act==='mNext'?1:-1),1);bookMonth=ymd(d).slice(0,7);render()}
  else if(act==='editSpend') spendSheet(state.spend.find(x=>x.id===b.dataset.id));
  else if(act==='payList') payListSheet();
  else if(act==='notifPerm'){if(N)N.LocalNotifications.requestPermissions().then(p=>{notifState=p.display==='granted'?'on':'off';render();reschedule();if(notifState==='off')toast('휴대폰 설정 → 앱 → 나의 하루판 → 알림에서 켜 주세요')})}
  else if(act==='clearEx'){
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='한 번 더 누르면 삭제';return}
    const exRec=new Set(state.recs.filter(r=>r.ex).map(r=>r.id));
    state.tasks=state.tasks.filter(t=>!t.ex&&!exRec.has(t.recId));state.recs=state.recs.filter(r=>!r.ex);
    state.fixed=state.fixed.filter(f=>!f.ex);state.accounts=state.accounts.filter(a=>!a.ex);state.pays=state.pays.filter(p=>!p.ex);
    state.spend=state.spend.filter(x=>!x.ex);state.paid={};state.hasEx=false;save();render();toast('예시를 지웠어요');
  }
});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();scrollTo(0,0)}));
document.getElementById('fab').addEventListener('click',()=>tab==='todo'?taskSheet('new'):sub==='book'?spendSheet(null):fixedSheet(null));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(sod(new Date())-today)render()});
load().then(s=>{state=s;render();setupNative()});
})();
</script>
